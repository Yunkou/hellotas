name: Feedback about the website
description: Something wrong, out of date or missing on the site, or an idea to make it more useful.
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. The team reads every note. You don't need to be a student to send one.

        To suggest an event instead, use the **Suggest an event** form.
  - type: dropdown
    id: kind
    attributes:
      label: What is it about?
      options:
        - Something is wrong or out of date
        - Something is missing
        - An idea or suggestion
        - A problem using the site (page, phone, language)
        - Something else
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Which page?
      description: Optional. Paste the address, or name the page (for example "Fun Time" or "Kickstart").
      placeholder: https://...
  - type: textarea
    id: details
    attributes:
      label: Your feedback
      description: What you saw, what you expected, or what you would like to see. For out-of-date details, the correct ones and where they come from help a lot.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: How can we reach you?
      description: Optional, and visible to everyone on GitHub. Leave it empty to stay anonymous.
