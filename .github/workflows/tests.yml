name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Lint the Python code (settings in ruff.toml)
        run: |
          pip install ruff==0.17.5
          ruff check collector server

  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - run: pip install './collector[test]'
      - run: pytest collector -q

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hellotas
          POSTGRES_PASSWORD: hellotas
          POSTGRES_DB: hellotas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hellotas" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install './server[test]'
      - name: Tests on SQLite
        run: pytest server -q
      - name: Tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://hellotas:hellotas@localhost:5432/hellotas_test
        run: pytest server -q

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.166.0"
          extended: true
      - name: Reuse the resized photos from earlier builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: resources/_gen
          key: hugo-images-${{ hashFiles('static/images/**', 'layouts/partials/img.html') }}
          restore-keys: hugo-images-
      - name: Build
        run: hugo --minify --panicOnWarning
      - name: Build with the community features switched on (the other configuration the site ships in)
        env:
          HUGO_PARAMS_COMMUNITYAPI: https://api.example.org
        run: hugo --minify --panicOnWarning --destination "$RUNNER_TEMP/site-with-api"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - name: Check every upcoming event has a picture, and the calendar and JSON feeds
        run: |
          pip install ./collector
          hellotas-collect check-data
          hellotas-collect check-site public
