<dialog class="place-lightbox" id="place-lightbox" aria-label="{{ i18n "placePhotosLabel" }}">
  <button type="button" class="place-lightbox-close" aria-label="{{ i18n "placeClose" }}">×</button>
  <img alt="">
  <p class="place-lightbox-caption"></p>
</dialog>
<script>
(function () {
  var dlg = document.getElementById('place-lightbox');
  if (!dlg || typeof dlg.showModal !== 'function') return;
  var img = dlg.querySelector('img'), cap = dlg.querySelector('.place-lightbox-caption');
  document.querySelectorAll('.place-photo').forEach(function (btn) {
    btn.addEventListener('click', function () {
      img.src = btn.dataset.full; img.alt = btn.dataset.alt; cap.textContent = btn.dataset.alt;
      dlg.showModal();
    });
  });
  dlg.querySelector('.place-lightbox-close').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
})();
</script>
