<!DOCTYPE html>
<html{{- if eq .Language.Lang "zh" }} lang="zh-CN"{{ else }} lang="{{ .Language.LanguageCode }}"{{ end }}>
<head>
  {{ $style := resources.Get "css/custom.css" | fingerprint }}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">
</head>
<body data-lb-close="{{ i18n "lightboxClose" }}" data-lb-prev="{{ i18n "carouselPrev" }}" data-lb-next="{{ i18n "carouselNext" }}">
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $carousel := resources.Get "js/carousel.js" | minify | fingerprint }}
  <script src="{{ $carousel.RelPermalink }}" defer></script>
</body>
</html>
