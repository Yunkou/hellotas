intro:
  - en: "The University's own gym is on the Sandy Bay campus, a short walk from class. It's open to students, staff and the public, and students pay the lowest weekly rate. Members can come in any day from 5 am to midnight."
    zh: "大学自己的健身房就在 Sandy Bay 校区，下课走几步就到。学生、教职员和公众都可以加入，学生的每周费用最低。会员每天 5 am 到午夜都能进场。"
    ne: "विश्वविद्यालयको आफ्नै जिम Sandy Bay क्याम्पसमै छ, कक्षाबाट केही पाइलामा। विद्यार्थी, कर्मचारी र आम जनता सबै सदस्य बन्न सक्छन्, र विद्यार्थीको साप्ताहिक शुल्क सबैभन्दा कम छ। सदस्यहरू हरेक दिन बिहान 5 बजेदेखि मध्यरातसम्म आउन सक्छन्।"
points:
  - en: "<strong>Gym floor:</strong> cardio machines and free weights, plus the High Performance Centre with squat racks, lifting platforms and a full-length sled track."
    zh: "<strong>健身区：</strong>有氧器械和自由重量区，另有 High Performance Centre，配备深蹲架、举重台和全长雪橇推道。"
    ne: "<strong>जिम फ्लोर:</strong> कार्डियो मेसिन र फ्री-वेट, साथै squat rack, lifting platform र पूरा लम्बाइको sled track भएको High Performance Centre।"
  - en: "<strong>Classes:</strong> group fitness and spin classes (the spin room has 28 bikes). Book online and download the Hobart timetable from the UniGym page."
    zh: "<strong>团体课：</strong>团体健身课和动感单车课（单车房有 28 辆单车）。在线预约，并可在 UniGym 页面下载 Hobart 课程表。"
    ne: "<strong>कक्षाहरू:</strong> समूह फिटनेस र स्पिन कक्षा (स्पिन कोठामा 28 वटा साइकल)। अनलाइन बुक गर्नुहोस् र UniGym पेजबाट Hobart को समयतालिका डाउनलोड गर्नुहोस्।"
  - en: "<strong>Courts and fields:</strong> a sports hall for basketball, volleyball, netball, futsal, badminton and pickleball, two squash courts ($20 per court per hour, racquets for hire), tennis courts, ovals and a dojo."
    zh: "<strong>球场和场地：</strong>综合体育馆可打篮球、排球、无板篮球、五人制足球、羽毛球和匹克球；两块壁球场（每场每小时 $20，可租球拍）；还有网球场、椭圆运动场和道场。"
    ne: "<strong>कोर्ट र मैदान:</strong> बास्केटबल, भलिबल, नेटबल, फुटसल, ब्याडमिन्टन र पिकलबलका लागि स्पोर्ट्स हल, दुई स्क्वास कोर्ट (प्रति कोर्ट प्रति घण्टा $20, र्‍याकेट भाडामा), टेनिस कोर्ट, ओभल र डोजो।"
  - en: "<strong>Joining:</strong> there's no joining fee, but you'll need a $20 access fob if you don't already have one. Watch the short induction video before your first workout."
    zh: "<strong>入会：</strong>没有入会费，但如果还没有门禁钥匙扣，需要花 $20 购买。第一次训练前请先看简短的入门视频。"
    ne: "<strong>सदस्यता:</strong> सदस्यता शुल्क छैन, तर पहिले नै नभए $20 को access fob किन्नुपर्छ। पहिलो पटक व्यायाम गर्नुअघि छोटो induction भिडियो हेर्नुहोस्।"
  - en: "<strong>Other campuses:</strong> there are UniGyms in Launceston and Burnie too, and Hobart and Launceston members can use both."
    zh: "<strong>其他校区：</strong>Launceston 和 Burnie 也有 UniGym，Hobart 和 Launceston 的会员可以互通使用。"
    ne: "<strong>अन्य क्याम्पस:</strong> Launceston र Burnie मा पनि UniGym छन्, र Hobart तथा Launceston का सदस्यले दुवै प्रयोग गर्न सक्छन्।"
