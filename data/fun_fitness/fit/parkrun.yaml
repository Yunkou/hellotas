intro:
  - en: "parkrun is a free, timed 5 km community event held every Saturday morning. You can walk, jog, run, volunteer or spectate. There is no time limit and no one finishes last, so everyone is welcome, whatever your pace."
    zh: "parkrun 是一项每周六早上举行的免费 5 公里计时社区活动。你可以步行、慢跑、跑步、做志愿者或观看。活动没有完成时间限制，也不会有人被落下，无论速度快慢都欢迎参加。"
    ne: "parkrun हरेक शनिबार बिहान आयोजना हुने निःशुल्क ५ किलोमिटरको समय मापन गरिने सामुदायिक कार्यक्रम हो। तपाईं हिँड्न, जगिङ गर्न, दौडन, स्वयंसेवा गर्न वा हेर्न सक्नुहुन्छ। समयसीमा छैन र कोही पनि अन्तिम हुँदैन, त्यसैले जुनसुकै गतिमा भए पनि सबैलाई स्वागत छ।"
  - en: "junior parkrun is a 2 km run for 4–14 year olds and their families on Sunday mornings; there isn't one near Hobart at the moment."
    zh: "junior parkrun 是为 4–14 岁儿童及其家人举办的 2 公里跑，在周日早上进行；目前 Hobart 附近还没有。"
    ne: "junior parkrun 4–14 वर्षका बालबालिका र उनीहरूको परिवारका लागि आइतबार बिहान हुने 2 किलोमिटरको दौड हो; अहिले Hobart नजिक छैन।"
points:
  - en: "<strong>Before your first one:</strong> <a href=\"https://www.parkrun.com.au/register/\" target=\"_blank\" rel=\"noopener\">register once</a> online (free) and bring a scannable copy of your barcode, printed or on your phone. No barcode, no recorded finish time. For your first parkrun, arrive about 15 minutes early to attend the first-timers' briefing. You can also download the parkrun Official app from the Apple App Store or Google Play."
    zh: "<strong>第一次参加前：</strong>在网上<a href=\"https://www.parkrun.com.au/register/\" target=\"_blank\" rel=\"noopener\">注册一次</a>（免费），并带上可扫描的条形码，打印或存在手机里都行。没有条形码就无法记录完成时间。第一次参加建议提前约 15 分钟到达，以参加新参与者说明会。你也可以从 Apple App Store 或 Google Play 下载 parkrun Official 官方应用。"
    ne: "<strong>पहिलो पटकअघि:</strong> अनलाइन एक पटक <a href=\"https://www.parkrun.com.au/register/\" target=\"_blank\" rel=\"noopener\">दर्ता गर्नुहोस्</a> (निःशुल्क) र स्क्यान गर्न मिल्ने बारकोड छापेर वा फोनमा ल्याउनुहोस्। बारकोड नभए पूरा गरेको समय रेकर्ड हुँदैन। पहिलो पटक सहभागी हुँदा नयाँ सहभागीहरूको जानकारी सत्रमा भाग लिन करिब १५ मिनेट चाँडै आइपुग्नुहोस्। तपाईं Apple App Store वा Google Play बाट parkrun Official एप पनि डाउनलोड गर्न सक्नुहुन्छ।"
  - en: "<strong>Easy English practice:</strong> every event is run by volunteers, and most groups have a coffee together afterwards. At Queens Domain it's The Serve Cafe at the Domain Tennis Centre."
    zh: "<strong>轻松练英语：</strong>每场活动都由志愿者组织，大多数团体跑完会一起喝咖啡。Queens Domain 的大家会去 Domain Tennis Centre 的 The Serve Cafe。"
    ne: "<strong>सजिलो अंग्रेजी अभ्यास:</strong> हरेक कार्यक्रम स्वयंसेवकहरूले चलाउँछन्, र धेरैजसो समूह पछि सँगै कफी पिउँछन्। Queens Domain मा Domain Tennis Centre को The Serve Cafe जान्छन्।"
  - en: "<strong>Around Hobart:</strong> Queens Domain (2 Upper Domain Road), Bellerive (Bellerive Beach Park), Montrose Foreshore (825 Brooker Highway), Risdon Brook (Risdon Brook Park), Kingston Park (Goshawk Way, Kingston) and Pembroke (Sorell)."
    zh: "<strong>Hobart 周边：</strong>Queens Domain（2 Upper Domain Road）、Bellerive（Bellerive Beach Park）、Montrose Foreshore（825 Brooker Highway）、Risdon Brook（Risdon Brook Park）、Kingston Park（Goshawk Way, Kingston）以及 Pembroke (Sorell)。"
    ne: "<strong>Hobart वरपर:</strong> Queens Domain (2 Upper Domain Road), Bellerive (Bellerive Beach Park), Montrose Foreshore (825 Brooker Highway), Risdon Brook (Risdon Brook Park), Kingston Park (Goshawk Way, Kingston) र Pembroke (Sorell)।"
  - en: "<strong>Other campuses:</strong> Inveresk Precinct parkrun is right by the Launceston campus, and there's a Burnie parkrun near the Cradle Coast campus."
    zh: "<strong>其他校区：</strong>Inveresk Precinct parkrun 就在 Launceston 校区旁边，Cradle Coast 校区附近也有 Burnie parkrun。"
    ne: "<strong>अन्य क्याम्पस:</strong> Inveresk Precinct parkrun Launceston क्याम्पसको छेउमै छ, र Cradle Coast क्याम्पस नजिक Burnie parkrun छ।"
