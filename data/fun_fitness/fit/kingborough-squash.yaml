intro:
  - en: "\"Australia's southernmost squash club\" has been running for nearly 40 years at the Kingborough Sports Centre in Kingston, with its own clubrooms. It's friendly and social, and welcomes new players as much as experienced ones."
    zh: "这家自称“澳大利亚最南端的壁球俱乐部”已在 Kingston 的 Kingborough Sports Centre 开办近 40 年，拥有自己的俱乐部会所。氛围友好、重社交，新手和老手同样欢迎。"
    ne: "\"अस्ट्रेलियाको सबैभन्दा दक्षिणी स्क्वास क्लब\" लगभग 40 वर्षदेखि Kingston को Kingborough Sports Centre मा चलिरहेको छ, र यसको आफ्नै क्लबरुम छ। यो मिलनसार र सामाजिक छ, र अनुभवी जस्तै नयाँ खेलाडीलाई पनि स्वागत गर्छ।"
points:
  - en: "<strong>Try it:</strong> drop in on a Tuesday at 7 pm or a Thursday at 5 pm, or email the club to set up a trial game. Matches are arranged between players of a similar level."
    zh: "<strong>来试试：</strong>周二 7 pm 或周四 5 pm 直接过来，或发邮件给俱乐部约一次试打。俱乐部会安排水平相近的球员对打。"
    ne: "<strong>प्रयास गर्नुहोस्:</strong> मंगलबार 7 pm वा बिहिबार 5 pm मा सिधै आउनुहोस्, वा ट्रायल खेल मिलाउन क्लबलाई इमेल गर्नुहोस्। उस्तै स्तरका खेलाडीबीच खेल मिलाइन्छ।"
  - en: "<strong>Mixed pennant:</strong> men and women play together on Tuesday evenings. There are two pennants a year (summer and winter, about 16 weeks each), and each ends with a social dinner. It costs $13 a week, or $160 for the whole pennant."
    zh: "<strong>男女混合联赛：</strong>每周二晚上男女同场比赛。每年两季（夏季和冬季，各约 16 周），每季结束都有社交晚宴。每周 $13，或整季 $160。"
    ne: "<strong>मिश्रित pennant:</strong> मंगलबार साँझ पुरुष र महिला सँगै खेल्छन्। वर्षमा दुई pennant हुन्छन् (गर्मी र जाडो, प्रत्येक करिब 16 हप्ता), र प्रत्येक सामाजिक डिनरसँग सकिन्छ। हप्ताको $13, वा पूरै pennant को $160।"
  - en: "<strong>Bring:</strong> non-marking shoes and sportswear. You can borrow a racquet for a trial, and the club supplies balls."
    zh: "<strong>需要带：</strong>不留痕的运动鞋和运动服。试打时可以借球拍，球由俱乐部提供。"
    ne: "<strong>के ल्याउने:</strong> दाग नछोड्ने जुत्ता र खेलकुद पोसाक। ट्रायलका लागि र्‍याकेट सापट लिन सकिन्छ, र बल क्लबले दिन्छ।"
  - en: "<strong>Coaching:</strong> the club has three qualified Level 1 coaches and a junior program."
    zh: "<strong>教练：</strong>俱乐部有三名持证的一级教练，并设有青少年课程。"
    ne: "<strong>प्रशिक्षण:</strong> क्लबमा तीन जना योग्य Level 1 प्रशिक्षक र जुनियर कार्यक्रम छन्।"
