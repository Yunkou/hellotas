      en: "A narrative cooking game about family, love and loss, told through South Indian cuisine."
      zh: "通过南印度菜讲述家庭、爱与失去的叙事烹饪游戏。"
      ne: "दक्षिण भारतीय खानामार्फत परिवार, माया र गुमाउनेबारे भनिएको खाना पकाउने कथात्मक गेम।"
  - title: "Tiny Bookshop"
