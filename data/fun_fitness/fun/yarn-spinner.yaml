      zh: "讲述一名大学辍学生回到衰落工业小镇故乡的叙事冒险游戏。"
      ne: "कलेज छोडेकी एक युवती आफ्नो पुरानो औद्योगिक गृहनगर फर्केको कथा भएको साहसिक गेम।"
  - title: "A Short Hike"
    by: "Adam Robinson-Yu"
