    text:
      en: "A fishing adventure about Lovecraftian horrors."
      zh: "一款带有克苏鲁式恐怖元素的钓鱼冒险游戏。"
      ne: "Lovecraft शैलीका डरलाग्दा कुराबारे माछा मार्ने साहसिक गेम।"
  - title: "Night in the Woods"
