      ne: "Russell Kelly भन्छन् School of ICT Showcase Expo ले UTAS को प्रतिभा राम्रोसँग देखायो: स्थानीय विद्यालयका विद्यार्थीसहित 250 भन्दा बढी आगन्तुकले वास्तविक क्लाइन्टसँग काम गरेका 16 स्नातक टोली हेरे। Intuit Technologies ले प्रायोजन गरेको People's Choice Award Pharmacogenetic Decision Making Tool टोलीले जित्यो, जसले Legends of Business टोलीसँगै UTAS InVent पुरस्कार पनि पायो; संस्थाहरूले 12 हप्ताको विद्यार्थी प्रोजेक्टका लागि विद्यालयलाई सम्पर्क गर्न सक्छन्।"
