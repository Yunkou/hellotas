      en: "Russell Kelly calls the School of ICT Showcase Expo an impressive display of UTAS talent: more than 250 attendees, including local school students, saw 16 graduating teams who worked with real clients. Intuit Technologies sponsored the People's Choice Award, won by the Pharmacogenetic Decision Making Tool team, which also took a UTAS InVent prize alongside the Legends of Business team; organisations can approach the School to host a 12-week student project."
