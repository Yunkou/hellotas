about:
  en:
    - "The University of Tasmania (UTAS) School of ICT hosted its Semester 1 Showcase Expo on 28 May 2026 at the Studio Theatre, University Centre, Sandy Bay Campus, Hobart, from 10:00 AM to 2:00 PM."
    - "The event brought together 16 graduating Bachelor's and Master's ICT project teams, university staff, industry representatives, and visiting school students. More than 250 people attended the showcase, which highlighted student achievements, innovative technologies, and pathways into ICT education and careers."
    - "Graduating students presented capstone projects developed over 12 weeks in collaboration with industry and other external clients, demonstrating how academic knowledge and technical skills can be applied to real-world challenges. Featured projects included PharmaGene App, a pharmacogenetic decision-support tool designed to help healthcare professionals access prescribing recommendations; Gamifying Business Law for Postgraduates, an interactive learning experience developed with the UTAS Law School; and Cybersecurity Honeypot Network for Tasmanian SMEs, a system that captures and visualises cyberattack activity to help local businesses understand cybersecurity threats."
    - "Alongside the student project displays, five curriculum Major hubs introduced visitors to Application and Web Development, Artificial Intelligence, Cyber Security, Games and Creative Technologies, and the Internet of Things (IoT). Visiting Tasmanian school students in Years 9 to 12 also participated in dedicated information sessions, campus tours, and hands-on workshops, providing opportunities to explore ICT study options and experience university learning environments."
    - "The showcase celebrated outstanding student achievements through industry-supported awards. Intuit Technologies sponsored the People's Choice Award, won by the team behind the pharmacogenetic decision-support project. The UTAS InVent Prizes for Commercial Acumen recognised the pharmacogenetic project and the business law gamification project."
    - "For UTAS students, the showcase provided opportunities to present their technical achievements to a wider audience, demonstrate practical problem-solving skills, strengthen teamwork and professional communication, and engage with Tasmania's ICT community. The event also highlighted how industry-aligned capstone projects can contribute to students' professional portfolios and future career development."
  zh:
    - "University of Tasmania（UTAS）School of ICT 于 2026 年 5 月 28 日上午 10:00 至下午 2:00 在霍巴特 Sandy Bay 校区大学中心 Studio Theatre 举办了第一学期 Showcase Expo。"
    - "活动汇聚 16 支即将毕业的本科和硕士 ICT 项目团队、大学教职员、行业代表和来访的中学生，共有 250 多人参加。展会展示了学生成果、创新技术，以及进入 ICT 学习和职业的途径。"
    - "毕业生展示了与行业及其他外部客户合作、历时 12 周完成的毕业设计项目，说明课堂知识和技术能力可以如何用于解决实际问题。重点项目包括：PharmaGene App，一款帮助医护人员获取用药建议的药物基因组学决策支持工具；Gamifying Business Law for Postgraduates，与 UTAS 法学院合作开发的互动式商法学习体验；以及 Cybersecurity Honeypot Network for Tasmanian SMEs，一个捕捉并可视化网络攻击活动、帮助本地企业了解网络安全威胁的系统。"
    - "除了学生项目展台，五个专业方向展区向访客介绍了应用与网页开发、人工智能、网络安全、游戏与创意技术，以及物联网（IoT）。来访的塔斯马尼亚 9 至 12 年级中学生还参加了专门的信息会、校园参观和动手工作坊，了解 ICT 学习选择，体验大学的学习环境。"
    - "展会通过行业支持的奖项表彰优秀学生成果。Intuit Technologies 赞助的 People's Choice Award（观众选择奖）由药物基因组学决策支持项目团队获得。UTAS InVent 商业洞察奖（Prizes for Commercial Acumen）则颁给了药物基因组学项目和商法游戏化项目。"
    - "对 UTAS 学生来说，这次展会让他们向更广泛的观众展示技术成果，体现解决实际问题的能力，锻炼团队合作和职业沟通，并与塔斯马尼亚 ICT 社区交流。活动也说明，与行业接轨的毕业设计项目能充实学生的作品集，助力未来的职业发展。"
  ne:
    - "University of Tasmania (UTAS) को School of ICT ले 28 मे 2026 मा बिहान 10:00 देखि दिउँसो 2:00 सम्म होबार्टको Sandy Bay क्याम्पसस्थित University Centre को Studio Theatre मा सेमेस्टर 1 को Showcase Expo आयोजना गर्‍यो।"
    - "कार्यक्रमले स्नातक र स्नातकोत्तर तहका 16 वटा अन्तिम वर्षका ICT परियोजना टोली, विश्वविद्यालयका कर्मचारी, उद्योगका प्रतिनिधि र भ्रमणमा आएका विद्यालयका विद्यार्थीहरूलाई एकै ठाउँमा ल्यायो। 250 भन्दा बढी मानिस सहभागी भएको शोकेसले विद्यार्थीका उपलब्धि, नवीन प्रविधि, र ICT शिक्षा तथा करियरतर्फका मार्गहरू देखायो।"
    - "स्नातक हुन लागेका विद्यार्थीहरूले उद्योग र अन्य बाह्य ग्राहकहरूसँग मिलेर 12 हप्तामा बनाएका capstone परियोजनाहरू प्रस्तुत गरे, जसले शैक्षिक ज्ञान र प्राविधिक सीपलाई वास्तविक चुनौतीमा कसरी प्रयोग गर्न सकिन्छ भन्ने देखायो। प्रमुख परियोजनाहरूमा PharmaGene App, स्वास्थ्यकर्मीहरूलाई औषधि सिफारिस पाउन सहयोग गर्ने फार्माकोजेनेटिक निर्णय-सहयोग उपकरण; Gamifying Business Law for Postgraduates, UTAS Law School सँग मिलेर बनाइएको अन्तरक्रियात्मक सिकाइ अनुभव; र Cybersecurity Honeypot Network for Tasmanian SMEs, स्थानीय व्यवसायलाई साइबर खतरा बुझ्न मद्दत गर्न साइबर आक्रमणका गतिविधि सङ्कलन गरी देखाउने प्रणाली थिए।"
    - "विद्यार्थी परियोजनाका प्रदर्शनसँगै पाँच वटा मुख्य विषय (Major) केन्द्रले आगन्तुकहरूलाई Application and Web Development, Artificial Intelligence, Cyber Security, Games and Creative Technologies र Internet of Things (IoT) को परिचय दिए। भ्रमणमा आएका तस्मानियाका कक्षा 9 देखि 12 का विद्यार्थीहरूले छुट्टै सूचना सत्र, क्याम्पस भ्रमण र व्यावहारिक कार्यशालामा भाग लिए, जसले ICT अध्ययनका विकल्प बुझ्ने र विश्वविद्यालयको सिकाइ वातावरण अनुभव गर्ने अवसर दियो।"
    - "शोकेसले उद्योगको सहयोगमा दिइएका पुरस्कारमार्फत उत्कृष्ट विद्यार्थी उपलब्धिलाई सम्मान गर्‍यो। Intuit Technologies ले प्रायोजन गरेको People's Choice Award फार्माकोजेनेटिक निर्णय-सहयोग परियोजनाको टोलीले जित्यो। UTAS InVent Prizes for Commercial Acumen फार्माकोजेनेटिक परियोजना र व्यापार कानुन गेमिफिकेसन परियोजनालाई प्रदान गरियो।"
    - "UTAS विद्यार्थीहरूका लागि शोकेसले आफ्ना प्राविधिक उपलब्धि फराकिलो दर्शकसामु प्रस्तुत गर्ने, व्यावहारिक समस्या समाधान सीप देखाउने, टिमवर्क र पेसागत सञ्चार बलियो बनाउने, र तस्मानियाको ICT समुदायसँग जोडिने अवसर दियो। उद्योगसँग मेल खाने capstone परियोजनाहरूले विद्यार्थीको पेसागत पोर्टफोलियो र भविष्यको करियर विकासमा कसरी योगदान दिन सक्छन् भन्ने पनि कार्यक्रमले देखायो।"
