      en: "On Friday, 18 September 2026, I attended the ICT Careers Information Session at the University of Tasmania and came away with a much clearer picture of what the transition from university into the ICT industry can look like."
      zh: "2026年9月18日星期五，我参加了塔斯马尼亚大学的ICT职业信息会，对从大学过渡到ICT行业会是什么样子有了更清晰的认识。"
      ne: "शुक्रबार, 18 सेप्टेम्बर 2026 मा म तस्मानिया विश्वविद्यालयको ICT करियर सूचना सत्रमा सहभागी भएँ, र विश्वविद्यालयबाट ICT उद्योगमा जाने यात्रा कस्तो हुन सक्छ भन्ने धेरै स्पष्ट चित्र लिएर फर्किएँ।"
    summary:
      en: "Rashmika Siriwardhana attended the ICT Careers Information Session on 18 September 2026 and came away with a clearer picture of moving from university into Tasmania's ICT industry. The post sums up the speakers: Rachel Chong on startup hiring, Victor Le (Hays) on applying strategically, Georgi Brown (Red Apple IT) on standing out, Geoff Matt (Echoview) on software engineering careers, and Stuart Brinsmead and Alannah Grech on how ACS supports graduates."
      zh: "Rashmika Siriwardhana参加了2026年9月18日的ICT职业信息会，对从大学进入塔斯马尼亚ICT行业有了更清晰的认识。帖子总结了各位讲者：Rachel Chong谈初创企业招聘，Victor Le（Hays）谈有策略地申请，Georgi Brown（Red Apple IT）谈如何脱颖而出，Geoff Matt（Echoview）谈软件工程职业，Stuart Brinsmead和Alannah Grech谈ACS如何支持毕业生。"
      ne: "Rashmika Siriwardhana 18 सेप्टेम्बर 2026 को ICT करियर सूचना सत्रमा सहभागी भइन् र विश्वविद्यालयबाट तस्मानियाको ICT उद्योगमा जाने बाटोबारे स्पष्ट बुझाइ लिएर फर्किन्। पोस्टले वक्ताहरूको सार दिन्छ: Rachel Chong स्टार्टअप भर्तीबारे, Victor Le (Hays) रणनीतिक आवेदनबारे, Georgi Brown (Red Apple IT) फरक देखिनेबारे, Geoff Matt (Echoview) सफ्टवेयर इन्जिनियरिङ करियरबारे, र Stuart Brinsmead तथा Alannah Grech ACS ले स्नातकहरूलाई कसरी सहयोग गर्छ भन्नेबारे।"
    url: "https://www.linkedin.com/posts/rashmika-siriwardhana-1027a0313_utas-ict-informationtechnology-ugcPost-7507416792735039488-o_FD/"
