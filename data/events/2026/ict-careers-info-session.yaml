    content:
      en: "Last Friday, I had the opportunity to present at UTAS to IT students on how to identify the right roles, tailor applications and approach the job market strategically."
      zh: "上周五，我有机会在UTAS向IT学生分享如何找到合适的职位、有针对性地准备申请，以及有策略地进入就业市场。"
      ne: "गत शुक्रबार मलाई UTAS मा IT विद्यार्थीहरूलाई उपयुक्त भूमिका कसरी पहिचान गर्ने, आवेदन कसरी अनुकूल बनाउने र जागिर बजारमा रणनीतिक रूपमा कसरी अघि बढ्ने भन्नेबारे प्रस्तुति दिने अवसर मिल्यो।"
    summary:
      en: "Victor Le from Hays presented to UTAS IT students on finding the right roles, tailoring applications and approaching the job market strategically, a first for Victor. The post encourages students to step outside their comfort zone: reach out, go to networking events, ask for advice and apply without ticking every box, because in a small market like Tasmania connections count."
      zh: "Hays的Victor Le第一次向UTAS IT学生演讲，主题是找到合适的职位、有针对性地准备申请和有策略地求职。帖子鼓励学生走出舒适区：主动联系、参加社交活动、请教他人，即使不完全符合要求也勇敢申请，因为在塔斯马尼亚这样的小市场，人脉很重要。"
      ne: "Hays का Victor Le ले UTAS का IT विद्यार्थीहरूलाई उपयुक्त भूमिका खोज्ने, आवेदन अनुकूल बनाउने र जागिर बजारमा रणनीतिक रूपमा अघि बढ्नेबारे प्रस्तुति दिए, जुन Victor को पहिलो अनुभव थियो। पोस्टले विद्यार्थीहरूलाई सहज क्षेत्रबाट बाहिर निस्कन प्रोत्साहन गर्छ: सम्पर्क गर्नुहोस्, नेटवर्किङ कार्यक्रममा जानुहोस्, सल्लाह माग्नुहोस् र सबै सर्त पूरा नभए पनि आवेदन दिनुहोस्, किनकि तस्मानिया जस्तो सानो बजारमा सम्पर्क महत्त्वपूर्ण हुन्छ।"
    url: "https://www.linkedin.com/posts/victor-le-hays_hays-utas-tasmania-share-7507933322094923776-CH9o/"
