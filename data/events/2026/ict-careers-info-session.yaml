    content:
      en: "To find myself in the same lecture theatre 10 years later, sharing what I’ve learnt and playing a small role to help students take the next step, is an absolute honour."
      zh: "10年后回到同一个讲堂，分享我学到的东西，为帮助学生迈出下一步尽一份力，这是莫大的荣幸。"
      ne: "10 वर्षपछि उही लेक्चर थिएटरमा फर्केर आफूले सिकेका कुरा बाँड्दै विद्यार्थीहरूलाई अर्को कदम चाल्न सानो भूमिका खेल्न पाउनु ठूलो सम्मान हो।"
    summary:
      en: "Ten years after sitting in the same lecture theatre as an international student, Rachel Chong returned to speak to UTAS ICT students. The post traces a winding path from marine biology and accounting through seven years in tech startups to nervous-system regulation work, and mentions working with the University to shape its careers service."
      zh: "十年前作为国际学生坐在同一个讲堂里的Rachel Chong，回来为UTAS ICT学生演讲。帖子回顾了一段曲折的道路：从海洋生物学和会计，到七年科技初创企业经历，再到神经系统调节工作，并提到正在与大学合作打造职业服务。"
      ne: "अन्तर्राष्ट्रिय विद्यार्थीका रूपमा उही लेक्चर थिएटरमा बसेको दस वर्षपछि Rachel Chong UTAS का ICT विद्यार्थीहरूसँग बोल्न फर्किइन्। पोस्टले समुद्री जीवविज्ञान र लेखाबाट सात वर्ष प्रविधि स्टार्टअपमा हुँदै स्नायु प्रणाली नियमनको कामसम्मको घुमाउरो बाटो सम्झन्छ, र विश्वविद्यालयसँग मिलेर यसको करियर सेवा बनाउँदै गरेको उल्लेख गर्छ।"
    url: "https://www.linkedin.com/posts/rachelsychong_10-years-ago-i-sat-in-this-exact-lecture-ugcPost-7508666684942229504-t2uC/"
  - name: "Yu Wang"
    role:
