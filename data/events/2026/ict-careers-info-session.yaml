  - name: "Victor Le"
    role:
      en: "Senior Recruitment Consultant, Hays"
      zh: "Hays高级招聘顾问"
      ne: "वरिष्ठ भर्ती सल्लाहकार, Hays"
    avatar: "/images/events/2026/ict-careers-info-session/linkedin-victor-le-avatar.jpg"
