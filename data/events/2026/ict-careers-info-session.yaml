  ne: "विश्वविद्यालयबाट ICT करियरमा प्रवेशबारे भर्तीकर्ता, ACS, पूर्वविद्यार्थी र उद्योगका वक्ताहरूसहित School of ICT को पूरा दिनको सत्र।"
