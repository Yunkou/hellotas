summary:
  en: "A GDG Hobart session at UTAS on Progressive Web Apps and the shift from desktop software to the web."
  zh: "GDG Hobart在UTAS举办的活动，主题是渐进式网页应用（PWA）以及软件从桌面转向网页的趋势。"
  ne: "UTAS मा प्रोग्रेसिभ वेब एप र डेस्कटप सफ्टवेयरबाट वेबतर्फको परिवर्तनबारे GDG Hobart को सत्र।"
