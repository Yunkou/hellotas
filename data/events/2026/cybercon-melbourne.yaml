outcome:
  en: "Five sponsored places · three days of cyber security learning"
  zh: "五个资助名额 · 三天网络安全学习"
  ne: "पाँच प्रायोजित स्थान · तीन दिनको साइबर सुरक्षा सिकाइ"
about:
  en:
    - "AISA CyberCon Melbourne 2026, organised by the Australian Information Security Association (AISA), was held from 14 to 16 October 2026 at the Melbourne Convention and Exhibition Centre (MCEC)."
    - "The three-day conference brought together cybersecurity professionals, industry leaders, researchers, and students to explore emerging cybersecurity threats, artificial intelligence, security technologies, and current industry challenges."
    - "Five University of Tasmania (UTAS) students were selected to attend the conference with sponsorship from the School of ICT, providing valuable opportunities to gain industry exposure beyond Tasmania. Special thanks to Dr David Herbert and Professor Nicole Herbert for their support."
    - "The conference featured keynote presentations, technical sessions, interactive activities, and professional networking opportunities. Highlights included a keynote by Jen Easterly, CEO of RSAC and former Director of CISA, along with sessions on cybersecurity education, building a cyber range on a student budget, and the CTRL+ALT+COMPETE cybersecurity game show."
    - "For UTAS students, the conference offered opportunities to connect academic learning with real-world cybersecurity practices, gain practical insights, engage with industry professionals, and explore potential career pathways."
  zh:
    - "AISA CyberCon Melbourne 2026 由澳大利亚信息安全协会（AISA）主办，于 2026 年 10 月 14 日至 16 日在墨尔本会展中心（MCEC）举行。"
    - "这场为期三天的会议汇聚网络安全从业者、行业领袖、研究人员和学生，共同探讨新出现的网络安全威胁、人工智能、安全技术和当前的行业挑战。"
    - "五名 University of Tasmania（UTAS）学生入选，在 School of ICT 资助下参会，获得了在塔斯马尼亚以外接触行业的宝贵机会。特别感谢 David Herbert 博士和 Nicole Herbert 教授的支持。"
    - "会议包括主题演讲、技术分享、互动活动和职业社交机会。亮点包括 RSAC 首席执行官、美国网络安全和基础设施安全局（CISA）前局长 Jen Easterly 的主题演讲，以及关于网络安全教育、如何用学生预算搭建网络靶场的分享，还有 CTRL+ALT+COMPETE 网络安全游戏秀。"
    - "对 UTAS 学生来说，这次会议让他们把课堂所学与真实的网络安全实践联系起来，获得实用见解，与业界人士交流，并探索可能的职业道路。"
  ne:
    - "Australian Information Security Association (AISA) ले आयोजना गरेको AISA CyberCon Melbourne 2026, 14 देखि 16 अक्टोबर 2026 सम्म Melbourne Convention and Exhibition Centre (MCEC) मा सम्पन्न भयो।"
    - "तीन दिने यो सम्मेलनले साइबर सुरक्षाका पेसाकर्मी, उद्योगका अगुवा, अनुसन्धानकर्ता र विद्यार्थीहरूलाई नयाँ साइबर खतरा, कृत्रिम बुद्धिमत्ता, सुरक्षा प्रविधि र उद्योगका हालका चुनौतीहरूबारे छलफल गर्न एकै ठाउँमा ल्यायो।"
    - "University of Tasmania (UTAS) का पाँच विद्यार्थी School of ICT को प्रायोजनमा सम्मेलनमा सहभागी हुन छनोट भए, जसले उनीहरूलाई तस्मानियाबाहिर उद्योगको अनुभव लिने महत्त्वपूर्ण अवसर दियो। सहयोगका लागि Dr David Herbert र Professor Nicole Herbert लाई विशेष धन्यवाद।"
    - "सम्मेलनमा मुख्य प्रस्तुति, प्राविधिक सत्र, अन्तरक्रियात्मक गतिविधि र पेसागत नेटवर्किङका अवसरहरू थिए। मुख्य आकर्षणमा RSAC की CEO तथा CISA की पूर्व निर्देशक Jen Easterly को मुख्य प्रस्तुति, साइबर सुरक्षा शिक्षा र विद्यार्थीको बजेटमा साइबर रेन्ज बनाउनेबारेका सत्रहरू, र CTRL+ALT+COMPETE साइबर सुरक्षा गेम शो थिए।"
    - "UTAS विद्यार्थीहरूका लागि सम्मेलनले कक्षाको ज्ञानलाई वास्तविक साइबर सुरक्षा अभ्याससँग जोड्ने, व्यावहारिक बुझाइ पाउने, उद्योगका पेसाकर्मीहरूसँग कुरा गर्ने र सम्भावित करियर मार्ग खोज्ने अवसर दियो।"
student_voice:
  en: "Beyond the valuable learning opportunities, it was wonderful to share this experience with fellow UTAS students, meet new people, and make meaningful connections."
  zh: "除了宝贵的学习机会，能与UTAS同学共同经历、结识新朋友并建立有意义的联系，真的很美好。"
  ne: "बहुमूल्य सिकाइका अवसरबाहेक, UTAS का साथीहरूसँग यो अनुभव बाँड्न, नयाँ मानिसहरू भेट्न र अर्थपूर्ण सम्पर्क बनाउन पाउनु अद्भुत रह्यो।"
