    summary:
      en: "Gothami Jayasingha's notes from the CyberCon 2026 opening keynote by Jen Easterly, CEO of RSAC and former Director of the US Cybersecurity and Infrastructure Security Agency. The main takeaways: in an AI-driven world, human judgement and accountability still matter, and security should be built into software from the start rather than added later."
      zh: "Gothami Jayasingha对CyberCon 2026开幕主旨演讲的笔记，演讲者是RSAC首席执行官、美国网络安全与基础设施安全局前局长Jen Easterly。主要收获：在AI驱动的世界里，人的判断和责任依然重要，安全应从一开始就融入软件，而不是事后补救。"
      ne: "RSAC का CEO र अमेरिकी Cybersecurity and Infrastructure Security Agency की पूर्व निर्देशक Jen Easterly को CyberCon 2026 उद्घाटन प्रस्तुतिबारे Gothami Jayasingha का टिपोट। मुख्य सिकाइ: AI ले चलाउने संसारमा पनि मानवीय विवेक र जवाफदेहिता महत्त्वपूर्ण छ, र सुरक्षा पछि थप्नुभन्दा सुरुदेखि नै सफ्टवेयरमा समावेश गर्नुपर्छ।"
