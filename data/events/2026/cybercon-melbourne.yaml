summary:
  en: "Five UTAS students attended AISA CyberCon 2026 in Melbourne, gaining valuable cybersecurity industry exposure, learning and networking opportunities with School of ICT sponsorship."
  zh: "五名 UTAS 学生在 School of ICT 资助下参加了墨尔本 AISA CyberCon 2026，获得了宝贵的网络安全行业见识、学习和社交机会。"
  ne: "School of ICT को प्रायोजनमा पाँच जना UTAS विद्यार्थी मेलबर्नमा भएको AISA CyberCon 2026 मा सहभागी भए र साइबर सुरक्षा उद्योगको महत्त्वपूर्ण अनुभव, सिकाइ र नेटवर्किङका अवसर पाए।"
