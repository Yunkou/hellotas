  ne: "यो मेरो तेस्रो पटक UTAS ICT शोकेसमा सहभागी हुनु थियो। हरेक वर्ष म मेरो करियरबारे सोचाइ बदलिदिने नयाँ व्यक्ति भेट्छु।"
