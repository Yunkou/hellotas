about:
  en:
    - "The University of Tasmania (UTAS) School of ICT hosted its Semester 2 Showcase Expo, also known as ICT Showcase v4.0, on 6 October 2026 at the University Centre, Sandy Bay Campus, Hobart, from 11:00 AM to 2:00 PM. As the School's fourth and largest showcase, the event attracted more than 300 registrations and brought together students, academic staff, industry representatives, and members of Tasmania's technology community."
    - "The showcase featured 17 graduating ICT project teams, including 12 Bachelor's teams and five Master's teams, who presented projects developed over 12 weeks in collaboration with industry and external clients. Their work addressed real-world challenges across artificial intelligence, data analytics, cybersecurity, application development, and other emerging technologies, demonstrating how students applied their academic knowledge and technical skills to practical problems."
    - "Featured projects included Island Intelligence Platform, a data and AI solution developed for SportsTech Tasmania that brings together information from sport, health, and environmental sources; Olinda AI, an AI-powered course advisory chatbot designed to help Hobart College students and families access course and enrolment information; and CyberQuiz Pro, an adaptive learning platform supporting preparation for ISC2 cybersecurity certifications. Other student demonstrations included interactive dashboards, mobile applications, intelligent chatbots, and an ICT escape room."
    - "Alongside the student project displays, the event featured research lightning talks presented by ICT academic staff, PhD candidates, and recent PhD graduates at the Stanley Burbury Theatre, with additional research displays in the lobby. These activities provided visitors with opportunities to explore current ICT research, discover emerging technologies, and engage with the University's research community."
    - "The showcase also celebrated student achievements through industry-supported awards. Rose Flynn from UTAS InVent presented the Prizes for Business Acumen to the Island Intelligence Platform team in the Bachelor's category and the CyberQuiz Pro team in the Master's category. Data#3 supported the event as an industry sponsor, with its Best Capstone Project Award scheduled to be presented at the ICT Awards Night on 9 November 2026."
    - "For UTAS students, the showcase provided opportunities to demonstrate their technical achievements, present solutions to real-world problems, and receive feedback from industry professionals. Through project demonstrations, presentations, and networking, students could strengthen their teamwork, communication, and pitching skills while building connections with potential employers and collaborators. The event highlighted the value of industry-aligned capstone projects in developing professional portfolios and preparing students for future careers in Tasmania's ICT industry."
  zh:
    - "University of Tasmania（UTAS）School of ICT 于 2026 年 10 月 6 日上午 11:00 至下午 2:00 在霍巴特 Sandy Bay 校区大学中心举办了第二学期 Showcase Expo，又称 ICT Showcase v4.0。作为学院第四届、也是规模最大的一届展会，活动吸引了 300 多人报名，汇聚学生、教职员、行业代表和塔斯马尼亚科技社区成员。"
    - "展会有 17 支即将毕业的 ICT 项目团队参展，其中本科团队 12 支、硕士团队 5 支。他们展示了与行业及外部客户合作、历时 12 周完成的项目，涉及人工智能、数据分析、网络安全、应用开发和其他新兴技术，说明学生如何把课堂知识和技术能力用于解决实际问题。"
    - "重点项目包括：Island Intelligence Platform，为 SportsTech Tasmania 开发、整合体育、健康和环境数据的数据与 AI 方案；Olinda AI，一款帮助 Hobart College 学生和家长查询课程和入学信息的 AI 课程咨询聊天机器人；以及 CyberQuiz Pro，一个帮助备考 ISC2 网络安全认证的自适应学习平台。其他学生演示还包括互动仪表板、移动应用、智能聊天机器人和一个 ICT 密室逃脱。"
    - "除了学生项目展台，ICT 教职员、博士生和新近毕业的博士在 Stanley Burbury Theatre 进行了研究闪电演讲，大厅里也有研究成果展示。这些活动让访客了解当前的 ICT 研究、发现新兴技术，并与学校的研究团队交流。"
    - "展会还通过行业支持的奖项表彰学生成果。UTAS InVent 的 Rose Flynn 将商业洞察奖（Prizes for Business Acumen）颁给了本科组的 Island Intelligence Platform 团队和硕士组的 CyberQuiz Pro 团队。Data#3 作为行业赞助商支持了本次活动，其最佳毕业设计项目奖（Best Capstone Project Award）将在 2026 年 11 月 9 日的 ICT Awards Night 上颁发。"
    - "对 UTAS 学生来说，这次展会让他们展示技术成果，介绍解决实际问题的方案，并获得业界人士的反馈。通过项目演示、展示和交流，学生锻炼了团队合作、沟通和路演能力，同时结识潜在雇主和合作伙伴。活动也说明了与行业接轨的毕业设计项目对于充实作品集、为未来在塔斯马尼亚 ICT 行业发展做准备的价值。"
  ne:
    - "University of Tasmania (UTAS) को School of ICT ले 6 अक्टोबर 2026 मा बिहान 11:00 देखि दिउँसो 2:00 सम्म होबार्टको Sandy Bay क्याम्पसस्थित University Centre मा सेमेस्टर 2 को Showcase Expo, जसलाई ICT Showcase v4.0 पनि भनिन्छ, आयोजना गर्‍यो। School को चौथो र अहिलेसम्मकै ठूलो यो शोकेसमा 300 भन्दा बढी दर्ता भए र विद्यार्थी, शैक्षिक कर्मचारी, उद्योगका प्रतिनिधि तथा तस्मानियाको प्रविधि समुदायका सदस्यहरू एकै ठाउँमा भेला भए।"
    - "शोकेसमा अन्तिम वर्षका 17 ICT परियोजना टोली थिए, जसमा स्नातकका 12 र स्नातकोत्तरका 5 टोली थिए। उनीहरूले उद्योग र बाह्य ग्राहकहरूसँग मिलेर 12 हप्तामा बनाएका परियोजना प्रस्तुत गरे। कृत्रिम बुद्धिमत्ता, डेटा एनालिटिक्स, साइबर सुरक्षा, एप विकास र अन्य नयाँ प्रविधिका वास्तविक चुनौती समेटिएका यी कामले विद्यार्थीहरूले आफ्नो शैक्षिक ज्ञान र प्राविधिक सीप व्यावहारिक समस्यामा कसरी प्रयोग गरे भन्ने देखायो।"
    - "प्रमुख परियोजनाहरूमा Island Intelligence Platform, खेलकुद, स्वास्थ्य र वातावरणका स्रोतबाट जानकारी एकै ठाउँमा ल्याउन SportsTech Tasmania का लागि बनाइएको डेटा र AI समाधान; Olinda AI, Hobart College का विद्यार्थी र परिवारलाई कोर्स तथा भर्नासम्बन्धी जानकारी पाउन सहयोग गर्ने AI कोर्स सल्लाहकार च्याटबट; र CyberQuiz Pro, ISC2 साइबर सुरक्षा प्रमाणपत्रको तयारीमा सहयोग गर्ने अनुकूलनशील सिकाइ प्लेटफर्म थिए। अन्य विद्यार्थी प्रदर्शनमा अन्तरक्रियात्मक ड्यासबोर्ड, मोबाइल एप, स्मार्ट च्याटबट र एउटा ICT escape room थिए।"
    - "विद्यार्थी परियोजनाका प्रदर्शनसँगै Stanley Burbury Theatre मा ICT का शैक्षिक कर्मचारी, PhD विद्यार्थी र भर्खरै PhD सकेकाहरूले अनुसन्धानका छोटा लाइटनिङ टक दिए, र लबीमा थप अनुसन्धान प्रदर्शनी थियो। यी गतिविधिले आगन्तुकहरूलाई हालको ICT अनुसन्धान बुझ्ने, नयाँ प्रविधि पत्ता लगाउने र विश्वविद्यालयको अनुसन्धान समुदायसँग कुरा गर्ने अवसर दिए।"
    - "शोकेसले उद्योगको सहयोगमा दिइएका पुरस्कारमार्फत विद्यार्थीका उपलब्धिलाई पनि सम्मान गर्‍यो। UTAS InVent की Rose Flynn ले Prizes for Business Acumen स्नातक वर्गमा Island Intelligence Platform टोली र स्नातकोत्तर वर्गमा CyberQuiz Pro टोलीलाई प्रदान गरिन्। Data#3 ले उद्योग प्रायोजकका रूपमा कार्यक्रमलाई सहयोग गर्‍यो, र यसको Best Capstone Project Award 9 नोभेम्बर 2026 को ICT Awards Night मा प्रदान गरिने तय छ।"
    - "UTAS विद्यार्थीहरूका लागि शोकेसले आफ्ना प्राविधिक उपलब्धि देखाउने, वास्तविक समस्याका समाधान प्रस्तुत गर्ने र उद्योगका पेसाकर्मीहरूबाट प्रतिक्रिया पाउने अवसर दियो। परियोजना प्रदर्शन, प्रस्तुति र नेटवर्किङमार्फत विद्यार्थीहरूले टिमवर्क, सञ्चार र पिचिङ सीप बलियो बनाउँदै सम्भावित रोजगारदाता र सहकर्मीहरूसँग सम्बन्ध बनाए। पेसागत पोर्टफोलियो बनाउन र तस्मानियाको ICT उद्योगमा भविष्यको करियरका लागि तयारी गर्न उद्योगसँग मेल खाने capstone परियोजनाको महत्त्व पनि कार्यक्रमले देखायो।"
