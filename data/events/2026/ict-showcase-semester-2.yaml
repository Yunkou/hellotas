    content:
      en: "Out of 12 Bachelor teams, I awarded the prize to the Island Intelligence Platform team, and out of 5 Masters teams, I awarded the prize to the CyberQuiz Pro team."
      zh: "在12个本科团队中，我将奖项颁给了Island Intelligence Platform团队；在5个硕士团队中，我将奖项颁给了CyberQuiz Pro团队。"
      ne: "12 स्नातक टोलीहरूमध्ये मैले पुरस्कार Island Intelligence Platform टोलीलाई र 5 स्नातकोत्तर टोलीहरूमध्ये CyberQuiz Pro टोलीलाई प्रदान गरें।"
    summary:
      en: "Rose Flynn judged the InVent Prizes for Commercial Acumen at the ICT Showcase, awarding the Bachelor prize to the Island Intelligence Platform (out of 12 teams) and the Masters prize to CyberQuiz Pro (out of 5). The post praises the School of ICT staff behind the program and notes this fourth Showcase was the largest yet, with over 300 attendees and sponsorship from Data#3."
      zh: "Rose Flynn担任ICT展示会InVent商业眼光奖的评委，把本科组奖项（共12队）颁给Island Intelligence Platform，把硕士组奖项（共5队）颁给CyberQuiz Pro。帖子称赞了ICT学院幕后的教职员工，并提到这第四届展示会是迄今规模最大的一届，来宾超过300人，由Data#3赞助。"
      ne: "Rose Flynn ले ICT Showcase मा InVent Prizes for Commercial Acumen को निर्णायक भई स्नातक पुरस्कार (12 टोलीमध्ये) Island Intelligence Platform लाई र स्नातकोत्तर पुरस्कार (5 टोलीमध्ये) CyberQuiz Pro लाई दिइन्। पोस्टले कार्यक्रमको पछाडिका School of ICT कर्मचारीहरूको प्रशंसा गर्छ र यो चौथो शोकेस 300 भन्दा बढी आगन्तुक र Data#3 को प्रायोजनसहित अहिलेसम्मकै ठूलो भएको उल्लेख गर्छ।"
    url: "https://www.linkedin.com/posts/rose-flynn-a41a9657_this-week-i-had-the-good-fortune-of-adjudicating-ugcPost-7513758904921518081-t6aC/"
