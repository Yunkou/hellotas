    summary:
      en: "Lindsay Wells wraps up ICT Showcase v4.0, the biggest yet with more than 300 registrations, and says attendees were impressed by the projects and especially the teams' pitching. UTAS InVent Business Acumen awards went to CyberQuiz Pro and the Island Intelligence Platform, with the Data#3 best capstone award still to come at the ICT Awards Night."
      zh: "Lindsay Wells总结了第四届ICT展示会：登记人数超过300人，是迄今规模最大的一届；来宾对项目、尤其是团队的路演表现印象深刻。UTAS InVent商业眼光奖由CyberQuiz Pro和Island Intelligence Platform获得，Data#3最佳毕业设计奖将在ICT颁奖之夜揭晓。"
      ne: "Lindsay Wells ले ICT Showcase v4.0 को समापन गर्छन्, जुन 300 भन्दा बढी दर्तासहित अहिलेसम्मकै ठूलो थियो, र आगन्तुकहरू प्रोजेक्ट तथा विशेषगरी टोलीहरूको पिचबाट प्रभावित भएको बताउँछन्। UTAS InVent Business Acumen पुरस्कार CyberQuiz Pro र Island Intelligence Platform ले जिते, र Data#3 को उत्कृष्ट क्याप्स्टोन पुरस्कार ICT Awards Night मा घोषणा हुनेछ।"
    url: "https://www.linkedin.com/posts/lindsay-wells-24658b76_ict-showcase-v40-completed-i-wish-i-could-ugcPost-7513441565584035840-yJbM/"
  - name: "MD Rifat Bin Yusuf"
    role:
      en: "Master of IT Student at UTAS"
      zh: "UTAS信息技术硕士学生"
      ne: "UTAS मा सूचना प्रविधिका स्नातकोत्तर विद्यार्थी"
    avatar: "/images/events/2026/ict-showcase-semester-2/linkedin-md-rifat-bin-yusuf-avatar.jpg"
    images:
      - "/images/events/2026/ict-showcase-semester-2/linkedin-md-rifat-bin-yusuf-1.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-md-rifat-bin-yusuf-2.jpg"
    content:
      en: "Over the past few months, our team developed a custom WordPress plugin for Tasmanian Leaders that turned a decade’s worth of programme evaluation data into clear charts, interactive visualizations and useful summaries."
      zh: "在过去的几个月里，我们团队为Tasmanian Leaders开发了一个定制的WordPress插件，将十年的项目评估数据转化为清晰的图表、交互式可视化和有用的摘要。"
      ne: "गत केही महिनामा, हाम्रो टोलीले Tasmanian Leaders का लागि एक टेलरमेड WordPress प्लगइन विकास गर्‍यौं, जसले एक दशकको कार्यक्रम मूल्याङ्कन डाटालाई स्पष्ट चार्टहरू, अन्तरक्रियात्मक भिजुअलाइजेसनहरू र उपयोगी सारांशहरूमा बदल्यो।"
    summary:
      en: "MD Rifat Bin Yusuf's team built a custom WordPress plugin for Tasmanian Leaders that turns ten years of programme evaluation data into charts, visualisations and summaries, with admin and public dashboards. As Technical Lead, Rifat chose the stack, set up a Docker-based development environment, designed the architecture and built the Gravity Forms API integration and automated reporting."
      zh: "MD Rifat Bin Yusuf的团队为Tasmanian Leaders开发了一款定制WordPress插件，把十年的项目评估数据转化为图表、可视化和摘要，并提供管理端和公开仪表板。作为技术负责人，Rifat负责技术选型、搭建基于Docker的开发环境、设计系统架构，并实现了Gravity Forms API集成和自动报告。"
      ne: "MD Rifat Bin Yusuf को टोलीले Tasmanian Leaders का लागि दस वर्षको कार्यक्रम मूल्याङ्कन डाटालाई चार्ट, भिजुअलाइजेसन र सारांशमा बदल्ने WordPress प्लगइन बनायो, जसमा एडमिन र सार्वजनिक ड्यासबोर्ड छन्। Technical Lead को रूपमा Rifat ले प्रविधि छनोट गरे, Docker मा आधारित विकास वातावरण बनाए, आर्किटेक्चर डिजाइन गरे र Gravity Forms API एकीकरण तथा स्वचालित रिपोर्टिङ तयार पारे।"
    url: "https://www.linkedin.com/posts/rifatyusuf_utas-ictexpo-tasmanianleaders-ugcPost-7514123551268974592-4axb/"
  - name: "Hosna Ara Begum"
    role:
      en: "Power BI & Data Analytics Consultant · Master of IT, UTAS"
      zh: "Power BI与数据分析顾问 · UTAS信息技术硕士"
      ne: "Power BI तथा डाटा एनालिटिक्स कन्सल्टेन्ट · UTAS सूचना प्रविधि स्नातकोत्तर"
    avatar: "/images/events/2026/ict-showcase-semester-2/linkedin-hosna-ara-begum-avatar.jpg"
    images:
      - "/images/events/2026/ict-showcase-semester-2/linkedin-hosna-ara-begum-1.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-hosna-ara-begum-2.jpg"
    content:
      en: "Long tiring hardworking of 6 persons for 12 weeks finally paid off with winning. My Team - CyberQuiz Pro, has won the Prize for Business Acumen (KIT700) at the University of Tasmania ICT Showcase."
      zh: "6个人12周的长期艰苦工作终于获得了回报。我的团队CyberQuiz Pro在塔斯马尼亚大学ICT展览会上赢得了商业才能奖（KIT700）。"
      ne: "6 जना विद्यार्थीको 12 हप्ताको लामो र मेहनती काम अन्ततः जितसँगै फलियो। मेरो टोली CyberQuiz Pro ले तस्मानिया विश्वविद्यालयको ICT शोकेसमा व्यावसायिक क्षमताको पुरस्कार (KIT700) जित्यो।"
    summary:
      en: "Hosna Ara Begum's team of six won the Prize for Business Acumen (KIT700) for CyberQuiz Pro after twelve weeks on their capstone project, which paired the technical build with real user needs and a clear path for future development. The post thanks the client, judge Rose Flynn and Ming Wong, and promises a series of posts on leading the team and lessons learned."
      zh: "Hosna Ara Begum所在的六人团队经过12周的毕业设计，凭借CyberQuiz Pro赢得了商业眼光奖（KIT700）；项目把技术实现与真实用户需求和清晰的后续发展方向结合在一起。帖子感谢了客户、评委Rose Flynn和Ming Wong，并预告将陆续分享带领团队的经历与心得。"
      ne: "Hosna Ara Begum को छ जनाको टोलीले 12 हप्ताको क्याप्स्टोन प्रोजेक्टपछि CyberQuiz Pro का लागि Prize for Business Acumen (KIT700) जित्यो; प्रोजेक्टले प्राविधिक निर्माणलाई वास्तविक प्रयोगकर्ताका आवश्यकता र भविष्यको स्पष्ट बाटोसँग जोडेको थियो। पोस्टले क्लाइन्ट, निर्णायक Rose Flynn र Ming Wong लाई धन्यवाद दिन्छ, र टोली नेतृत्व र सिकाइबारे थप पोस्टहरू आउने बताउँछ।"
    url: "https://www.linkedin.com/posts/habegum_long-tiring-hardworking-of-6-persons-for-ugcPost-7513684086582878209-dObr/"
  - name: "Chris Jackson (MBA)"
    role:
      en: "State Sales Manager at Data#3"
      zh: "Data#3州销售经理"
      ne: "Data#3 मा राज्य सेल्स म्यानेजर"
    avatar: "/images/events/2026/ict-showcase-semester-2/linkedin-chris-jackson-avatar.jpg"
    images:
      - "/images/events/2026/ict-showcase-semester-2/linkedin-chris-jackson-1.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-chris-jackson-2.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-chris-jackson-3.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-chris-jackson-4.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-chris-jackson-5.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-chris-jackson-6.jpg"
    content:
      en: "What an inspiring day at the University of Tasmania ICT Showcase Expo! 15 projects, a room full of rising talent, and a real glimpse of where Tasmania's tech future is heading."
      zh: "在塔斯马尼亚大学ICT展览会上度过了鼓舞人心的一天!15个项目，一屋子正在崛起的人才，以及对塔斯马尼亚科技未来方向的真实glimpse。"
      ne: "तस्मानिया विश्वविद्यालयको ICT शोकेस एक्स्पोमा यति प्रेरणादायी दिन! 15 प्रोजेक्टहरू, उदयमान प्रतिभाहरूले भरिएको कोठा, र तस्मानियाको प्रविधिको भविष्य कहाँ जाँदैछ भन्ने स्पष्ट झलक।"
    summary:
      en: "Chris Jackson from Data#3, an event sponsor, calls the Showcase a glimpse of Tasmania's tech future, with 15 projects on show. The post congratulates the six students behind the Island Intelligence Platform pilot for SportsTech Tasmania, recognised with the Commercial Ready Award for a shared data and AI layer that joins up sport, health, environment and public data that usually sits in silos."
      zh: "赞助方Data#3的Chris Jackson表示，这次展示会让人看到了塔斯马尼亚科技的未来，共有15个项目参展。帖子祝贺了为SportsTech Tasmania打造Island Intelligence Platform试点的六名学生，他们构建了一个共享的数据与AI层，把原本分散的体育、健康、环境和公共数据整合在一起，并因此获得“商业就绪奖”。"
      ne: "कार्यक्रमका प्रायोजक Data#3 का Chris Jackson ले 15 प्रोजेक्ट प्रदर्शन भएको शोकेसलाई तस्मानियाको प्रविधिको भविष्यको झलक भन्छन्। पोस्टले SportsTech Tasmania का लागि Island Intelligence Platform पाइलट बनाउने छ जना विद्यार्थीलाई बधाई दिन्छ, जसले प्रायः छुट्टाछुट्टै रहने खेलकुद, स्वास्थ्य, वातावरण र सार्वजनिक डाटालाई जोड्ने साझा डाटा र AI तह बनाएर Commercial Ready Award पाए।"
    url: "https://www.linkedin.com/posts/chrisjackson3_what-an-inspiring-day-at-the-university-of-ugcPost-7513188432953745408-1Wf-/"
  - name: "John Streat"
    role:
      en: "Final year Bachelor of ICT (Data Science and AI) student"
      zh: "ICT学士（数据科学与AI）最后一年学生"
      ne: "ICT (डाटा साइन्स र AI) को अन्तिम वर्षका स्नातक विद्यार्थी"
    avatar: "/images/events/2026/ict-showcase-semester-2/linkedin-john-streat-avatar.jpg"
    images:
      - "/images/events/2026/ict-showcase-semester-2/linkedin-john-streat-1.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-john-streat-2.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-john-streat-3.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-john-streat-4.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-john-streat-5.jpg"
    content:
      en: "Proud to share that our Island Intelligence Platform team won the Commercial Acumen Award at the University of Tasmania ICT Showcase Expo."
      zh: "很自豪地分享，我们的Island Intelligence Platform团队在塔斯马尼亚大学ICT展览会上赢得了商业才能奖。"
      ne: "हाम्रो Island Intelligence Platform टोलीले तस्मानिया विश्वविद्यालयको ICT शोकेस एक्स्पोमा व्यावसायिक क्षमताको पुरस्कार जितेकोमा गर्व छ।"
    summary:
      en: "John Streat's team of six won the Commercial Acumen Award for the Island Intelligence Platform, built over 12 weeks for SportsTech Tasmania. It brings sport, health, community, economic and environmental data from more than a dozen government sources into one regularly refreshed, traceable place; as Lead Architect, John designed the database and REST API and led the project's technical decisions."
      zh: "John Streat所在的六人团队凭借为SportsTech Tasmania开发的Island Intelligence Platform获得商业眼光奖。平台用12周建成，将十多个政府来源的体育、健康、社区、经济和环境数据汇集到一处，定期更新且可追溯来源；John作为首席架构师设计了数据库和REST API，并主导项目的技术决策。"
      ne: "John Streat को छ जनाको टोलीले SportsTech Tasmania का लागि 12 हप्तामा बनाएको Island Intelligence Platform का लागि Commercial Acumen Award जित्यो। यसले दर्जनभन्दा बढी सरकारी स्रोतका खेलकुद, स्वास्थ्य, समुदाय, आर्थिक र वातावरणीय डाटालाई नियमित अद्यावधिक हुने र स्रोत खोज्न मिल्ने एउटै ठाउँमा ल्याउँछ; Lead Architect को रूपमा John ले डाटाबेस र REST API डिजाइन गरे र प्रोजेक्टका प्राविधिक निर्णयहरूको नेतृत्व गरे।"
    url: "https://www.linkedin.com/posts/john-streat-7b35a12b8_universityoftasmania-sportstech-dataarchitecture-ugcPost-7514242664318373888-ft_L/"
  - name: "MD Ashik Mahmud"
    role:
      en: "Master of IT student at UTAS"
      zh: "UTAS信息技术硕士学生"
      ne: "UTAS मा सूचना प्रविधिका स्नातकोत्तर विद्यार्थी"
    avatar: "/images/events/2026/ict-showcase-semester-2/linkedin-md-ashik-mahmud-avatar.jpg"
    images:
      - "/images/events/2026/ict-showcase-semester-2/linkedin-md-ashik-mahmud-1.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-md-ashik-mahmud-2.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-md-ashik-mahmud-3.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-md-ashik-mahmud-4.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-md-ashik-mahmud-5.jpg"
    content:
      en: "Our project was CyberQuiz Pro, an adaptive practice platform for the ISC2 certification pathway (CC, SSCP and CISSP)."
      zh: "我们的项目是CyberQuiz Pro，一个ISC2认证路径（CC、SSCP和CISSP）的自适应练习平台。"
      ne: "हाम्रो प्रोजेक्ट CyberQuiz Pro थियो — ISC2 प्रमाणीकरण मार्ग (CC, SSCP र CISSP) का लागि एक अनुकूली अभ्यास प्लेटफर्म।"
    summary:
      en: "MD Ashik Mahmud's team won the UTAS InVent Prize for Business Acumen for CyberQuiz Pro, an adaptive practice platform for ISC² certifications (CC, SSCP and CISSP). Instead of giving everyone the same questions, each answer shapes what comes next; the finished product includes mock exams, a pathway map across certifications, learner dashboards, admin analytics and a cloud deployment."
      zh: "MD Ashik Mahmud的团队凭借CyberQuiz Pro获得UTAS InVent商业眼光奖。这是一个面向ISC²认证（CC、SSCP和CISSP）的自适应练习平台：不再给所有人相同的题目，而是根据每次作答决定下一题；成品包括模拟考试、跨认证的知识路径图、学习者仪表板、管理分析和云端部署。"
      ne: "MD Ashik Mahmud को टोलीले CyberQuiz Pro का लागि UTAS InVent Prize for Business Acumen जित्यो, जुन ISC² प्रमाणपत्रहरू (CC, SSCP र CISSP) का लागि अनुकूलनशील अभ्यास प्लेटफर्म हो। सबैलाई एउटै प्रश्न दिनुको सट्टा हरेक उत्तरले अर्को प्रश्न तय गर्छ; तयार उत्पादनमा मक परीक्षा, प्रमाणपत्रहरूबीचको पाथवे नक्सा, सिकारु ड्यासबोर्ड, एडमिन विश्लेषण र क्लाउड डिप्लोयमेन्ट छन्।"
    url: "https://www.linkedin.com/posts/ashnrb_utas-universityoftasmania-schoolofict-ugcPost-7514208499711614976-d0bM/"
  - name: "Pial Hossain"
    role:
      en: "Student at University of Tasmania"
      zh: "University of Tasmania学生"
      ne: "University of Tasmania विद्यार्थी"
    avatar: "/images/events/2026/ict-showcase-semester-2/linkedin-pial-hossain-avatar.jpg"
    images:
      - "/images/events/2026/ict-showcase-semester-2/linkedin-pial-hossain-1.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-pial-hossain-2.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-pial-hossain-3.jpg"
      - "/images/events/2026/ict-showcase-semester-2/linkedin-pial-hossain-4.jpg"
    content:
      en: "Olinda is an AI-powered course advisory chatbot we developed for Hobart College."
      zh: "Olinda是我们为Hobart College开发的AI驱动的课程咨询聊天机器人。"
      ne: "Olinda हामीले Hobart College का लागि विकास गरेको AI-सञ्चालित कोर्स परामर्श च्याटबट हो।"
    summary:
      en: "Pial Hossain's team showcased Olinda AI, a course advisory chatbot built for Hobart College. It answers common student and parent questions about subjects, enrolment, the TCE, ATAR, VET and university pathways in plain English, using only approved College sources such as the 2027 Course Guide, to cut repetitive enquiries for staff."
      zh: "Pial Hossain的团队展示了为Hobart College开发的课程咨询聊天机器人Olinda AI。它用通俗易懂的语言回答学生和家长关于选课、注册、TCE、ATAR、VET和升学路径的常见问题，只使用2027课程指南等经学校认可的资料，从而减少教职员工的重复答疑。"
      ne: "Pial Hossain को टोलीले Hobart College का लागि बनाएको पाठ्यक्रम सल्लाहकार च्याटबट Olinda AI प्रस्तुत गर्‍यो। यसले विषय छनोट, भर्ना, TCE, ATAR, VET र विश्वविद्यालय मार्गबारे विद्यार्थी र अभिभावकका सामान्य प्रश्नहरूको सरल भाषामा उत्तर दिन्छ, 2027 Course Guide जस्ता कलेजले स्वीकृत गरेका स्रोत मात्र प्रयोग गरी कर्मचारीको दोहोरिने सोधपुछ घटाउँछ।"
    url: "https://www.linkedin.com/posts/pial-hossain-5a05162b8_olindaai-utas-ictshowcase-ugcPost-7513241527721246720-XTt4/"
