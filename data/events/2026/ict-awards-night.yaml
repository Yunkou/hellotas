  - name: "Georgi Brown"
    role:
      en: "Managing Director, Red Apple IT"
      zh: "Red Apple IT 董事总经理"
      ne: "Managing Director, Red Apple IT"
    avatar: "/images/events/2026/ict-awards-night/linkedin-georgi-brown-avatar.jpg"
    images:
      - "/images/events/2026/ict-awards-night/linkedin-georgi-brown-1.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-georgi-brown-2.jpg"
    content:
      en: "To every grad heading into the market this summer, start building your network now, before you need it."
      zh: "给今年夏天要找工作的每一位毕业生：现在就开始建立人脉，别等到需要的时候。"
      ne: "यो गर्मीमा रोजगार बजारमा जाँदै गरेका हरेक स्नातकलाई: आवश्यक पर्नुअघि नै अहिलेदेखि आफ्नो नेटवर्क बनाउन सुरु गर्नुहोस्।"
    summary:
      en: "Red Apple IT presented the Bachelor of ICT Academic Excellence Award to Tim Cox and the Systems Analysis award to Yixi Chen. Georgi shares that 90% of the jobs they recruit for are never advertised, so graduates relying on job boards alone miss most opportunities."
      zh: "Red Apple IT 把 ICT 学士学业卓越奖颁给了 Tim Cox，把系统分析方向奖颁给了 Yixi Chen。Georgi 提到，他们招聘的职位有 90% 从不公开发布，只靠招聘网站的毕业生会错过大部分机会。"
      ne: "Red Apple IT ले Tim Cox लाई Bachelor of ICT Academic Excellence Award र Yixi Chen लाई Systems Analysis पुरस्कार दियो। Georgi भन्नुहुन्छ, उनीहरूले भर्ती गर्ने 90% जागिर कहिल्यै विज्ञापन हुँदैनन्, त्यसैले जब बोर्डमा मात्र भर पर्ने स्नातकले धेरैजसो अवसर गुमाउँछन्।"
    url: "https://www.linkedin.com/posts/georgibrown_utas-tasmania-technologyrecruitment-ugcPost-7526112267378204672-p1HA/"
  - name: "Luoyan Wei"
