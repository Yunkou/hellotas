      ne: "Chris ले Business Process Improvement का लागि Outstanding ICT Individual Project पुरस्कार जित्नुभयो। Amigos Translate मा दोभाषेका रूपमा काम गर्दा बुकिङ व्यवस्थापन कति गाह्रो छ भनेर देखेपछि Chris ले आन्तरिक प्लेटफर्म र मोबाइल एप बनाउनुभयो।"
