    content:
      en: "Finding out someone put my name forward made my week."
      zh: "得知有人提名了我，让我开心了一整周。"
      ne: "कसैले मेरो नाम अघि सारेको थाहा पाउँदा मेरो पूरै हप्ता रमाइलो भयो।"
    summary:
      en: "Luoyan was a finalist for three awards: ICT Graduate of the Year, the ICT Community Spirit Award and the Students’ Choice Inquisitor Award. Two of the nominations came from people who nominated Luoyan without saying so."
      zh: "Luoyan 入围了三个奖项：年度 ICT 毕业生、ICT 社区精神奖和学生之选“提问者奖”。其中两项提名来自悄悄提名的人。"
      ne: "Luoyan तीन पुरस्कारको फाइनलिस्ट हुनुभयो: ICT Graduate of the Year, ICT Community Spirit Award र Students’ Choice Inquisitor Award। तीमध्ये दुई मनोनयन Luoyan लाई नभनी नाम अघि सार्ने मानिसबाट आएका थिए।"
    url: "https://www.linkedin.com/posts/luoyan-wei-9693842b2_utas-universityoftasmania-schoolofict-ugcPost-7527470710353551360-MXQ2/"
  - name: "Taniya Jayawardana"
    role:
      en: "IT and Systems Professional · Master of IT and Systems, University of Tasmania"
      zh: "IT 与系统专业人士 · University of Tasmania 信息技术与系统硕士"
      ne: "IT तथा सिस्टम्स प्रोफेसनल · Master of IT and Systems, University of Tasmania"
    avatar: "/images/events/2026/ict-awards-night/linkedin-taniya-jayawardana-avatar.jpg"
    images:
      - "/images/events/2026/ict-awards-night/linkedin-taniya-jayawardana-1.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-taniya-jayawardana-2.jpg"
    content:
      en: "Some achievements are measured by awards. Others are measured by the journey it took to get there."
      zh: "有些成就用奖项来衡量，有些则用走到这里的那段路来衡量。"
      ne: "केही उपलब्धि पुरस्कारले नापिन्छन्। अरू त्यहाँसम्म पुग्न लागेको यात्राले नापिन्छन्।"
    summary:
      en: "Taniya was nominated in three categories and was a finalist for the Students’ Choice Team Leadership Award. Taniya's post celebrates the journey behind a nomination: moving countries, living independently and balancing study, work and life."
      zh: "Taniya 获得三个类别的提名，并入围学生之选“团队领导奖”。Taniya 的帖子讲述了提名背后的路：出国、独立生活，以及兼顾学习、工作和生活。"
      ne: "Taniya तीन वर्गमा मनोनीत हुनुभयो र Students’ Choice Team Leadership Award को फाइनलिस्ट हुनुभयो। Taniya को पोस्टले मनोनयनपछाडिको यात्रा मनाउँछ: देश बदल्नु, एक्लै बस्नु र पढाइ, काम र जीवन सन्तुलन गर्नु।"
    url: "https://www.linkedin.com/posts/taniya-jayawardana_universityoftasmania-utas-ictawards2026-ugcPost-7525769575100100608-TE7k/"
