awards_note:
  en: "More than 100 Unit Excellence certificates went to the top student in each unit. Tim Cox, Hang Li, Bronson Billing, Jacob de Graaf, Abir Hossain Khondoker, Youngseok Kim, Gopal Baidawar Chhetri, Yixi Chen and Nusaiba Nizam each topped more than one unit."
  zh: "100 多份单元卓越证书颁给了每个单元成绩最高的学生。Tim Cox、Hang Li、Bronson Billing、Jacob de Graaf、Abir Hossain Khondoker、Youngseok Kim、Gopal Baidawar Chhetri、Yixi Chen 和 Nusaiba Nizam 都在不止一个单元中取得第一。"
  ne: "100 भन्दा बढी Unit Excellence प्रमाणपत्र हरेक युनिटमा सबैभन्दा उच्च अंक ल्याउने विद्यार्थीलाई दिइए। Tim Cox, Hang Li, Bronson Billing, Jacob de Graaf, Abir Hossain Khondoker, Youngseok Kim, Gopal Baidawar Chhetri, Yixi Chen र Nusaiba Nizam ले एकभन्दा बढी युनिटमा शीर्ष स्थान पाए।"
linkedin_posts:
  - name: "Nicole Herbert"
    role:
      en: "Professor, Head of School of ICT, University of Tasmania"
      zh: "教授，University of Tasmania School of ICT 院长"
      ne: "प्राध्यापक, School of ICT प्रमुख, University of Tasmania"
    avatar: "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-avatar.jpg"
    images:
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-10.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-1.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-9.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-11.jpg"
    content:
      en: "Of course, academic and research excellence deserve recognition. But university is about so much more than marks!"
      zh: "当然，学业和研究上的卓越值得表彰。但大学远不止分数！"
      ne: "पक्कै पनि, शैक्षिक र अनुसन्धान उत्कृष्टताले सम्मान पाउनुपर्छ। तर विश्वविद्यालय अंकभन्दा धेरै बढी हो!"
    summary:
      en: "Nicole Herbert looks back on the first ICT Awards Night: over 150 people across Hobart and Launceston, around 30 awards and around 100 Unit Excellence certificates, with every award sponsored by industry. Nicole thanks the 19 sponsors and hopes to make the night an annual tradition."
      zh: "Nicole Herbert 回顾首届 ICT 颁奖之夜：霍巴特和朗塞斯顿两地 150 多人参加，颁发约 30 个奖项和约 100 份单元卓越证书，每个奖项都有行业赞助。Nicole 感谢了 19 家赞助方，并希望把这个晚会办成每年的传统。"
      ne: "Nicole Herbert पहिलो ICT Awards Night सम्झनुहुन्छ: होबार्ट र लन्सेस्टनबाट 150 भन्दा बढी जना, करिब 30 पुरस्कार र करिब 100 Unit Excellence प्रमाणपत्र, र हरेक पुरस्कार उद्योगले प्रायोजन गरेको। Nicole 19 प्रायोजकलाई धन्यवाद दिनुहुन्छ र यो रातलाई वार्षिक परम्परा बनाउने आशा गर्नुहुन्छ।"
    url: "https://www.linkedin.com/posts/nicole-herbert0_what-a-night-our-inaugural-school-of-ugcPost-7525776538030620672-Yfln/"
  - name: "Gazi MD Wasi-UL Hoque Eusha"
    role:
      en: "ICT Academic Staff, University of Tasmania · 2026 ICT Graduate of the Year"
      zh: "University of Tasmania ICT 学术人员 · 2026 年度 ICT 毕业生"
      ne: "ICT शैक्षिक कर्मचारी, University of Tasmania · 2026 ICT Graduate of the Year"
    avatar: "/images/events/2026/ict-awards-night/linkedin-gazi-eusha-avatar.jpg"
    images:
      - "/images/events/2026/ict-awards-night/linkedin-gazi-eusha-1.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-gazi-eusha-2.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-gazi-eusha-3.jpg"
    content:
      en: "I am incredibly honoured to have been awarded the 2026 ICT Graduate of the Year (sponsored by ISW) and Academic Excellence in Master of Information Technology and Systems – Data Analytics and AI Specialisation (sponsored by Data#3)."
      zh: "我非常荣幸获得 2026 年度 ICT 毕业生奖（ISW 赞助），以及信息技术与系统硕士数据分析与 AI 方向学业卓越奖（Data#3 赞助）。"
      ne: "2026 ICT Graduate of the Year (ISW प्रायोजित) र Master of Information Technology and Systems – Data Analytics and AI Specialisation मा शैक्षिक उत्कृष्टता (Data#3 प्रायोजित) पाउँदा म अत्यन्तै सम्मानित महसुस गर्छु।"
    summary:
      en: "Eusha won the night's highest honour, the 2026 ICT Graduate of the Year, and the MITS Data Analytics and AI award. Eusha thanks Chris Jackson from Data#3 and Georgi Brown from Red Apple IT for presenting the awards, and Ming Wong and Nicole Herbert for the work behind the event."
      zh: "Eusha 获得了当晚的最高荣誉——2026 年度 ICT 毕业生，以及硕士数据分析与 AI 方向奖。Eusha 感谢 Data#3 的 Chris Jackson 和 Red Apple IT 的 Georgi Brown 颁奖，也感谢 Ming Wong 和 Nicole Herbert 在幕后的付出。"
      ne: "Eusha ले रातको सर्वोच्च सम्मान 2026 ICT Graduate of the Year र MITS Data Analytics and AI पुरस्कार जित्नुभयो। Eusha पुरस्कार हस्तान्तरण गर्ने Data#3 का Chris Jackson र Red Apple IT का Georgi Brown, र कार्यक्रमपछाडि मिहिनेत गर्ने Ming Wong र Nicole Herbert लाई धन्यवाद दिनुहुन्छ।"
    url: "https://www.linkedin.com/posts/gazi-eusha_beyond-ecstatic-to-share-a-major-milestone-ugcPost-7527259256446767104-udQF/"
  - name: "Tim Cox"
    role:
      en: "Student Research Programmer at CSIRO · Bachelor of ICT graduate"
      zh: "CSIRO 学生研究程序员 · ICT 学士毕业生"
      ne: "CSIRO मा स्टुडेन्ट रिसर्च प्रोग्रामर · Bachelor of ICT स्नातक"
    avatar: "/images/events/2026/ict-awards-night/linkedin-tim-cox-avatar.jpg"
    images:
      - "/images/events/2026/ict-awards-night/linkedin-tim-cox-1.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-tim-cox-2.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-tim-cox-3.jpg"
    content:
      en: "I would also encourage students to be curious and learn for the sake of learning; not every skill or project needs to have immediate value in the 'real-world'."
      zh: "我也鼓励同学们保持好奇，为了学习而学习；不是每一项技能或每一个项目都必须马上在“现实世界”里有用。"
      ne: "म विद्यार्थीहरूलाई जिज्ञासु बन्न र सिकाइकै लागि सिक्न पनि प्रोत्साहन गर्छु; हरेक सीप वा परियोजनाको तुरुन्तै 'वास्तविक संसार' मा मूल्य हुनुपर्छ भन्ने छैन।"
    summary:
      en: "Tim Cox won the Bachelor of ICT Academic Excellence Award as the top BICT graduate, plus the AI major award and two unit awards, and was a Graduate of the Year finalist. Tim's advice to students: work hard, stay curious, challenge yourself and take pride in your work."
      zh: "Tim Cox 作为成绩最好的 ICT 学士毕业生获得 ICT 学士学业卓越奖，还拿下人工智能专业奖和两个单元奖，并入围年度毕业生。Tim 给同学们的建议是：努力、保持好奇、挑战自己，并为自己的作品感到自豪。"
      ne: "Tim Cox ले सबैभन्दा उत्कृष्ट BICT स्नातकका रूपमा Bachelor of ICT Academic Excellence Award, AI मेजर पुरस्कार र दुई युनिट पुरस्कार जित्नुभयो, र Graduate of the Year को फाइनलिस्ट पनि हुनुभयो। विद्यार्थीलाई Tim को सल्लाह: मिहिनेत गर्नुहोस्, जिज्ञासु रहनुहोस्, आफूलाई चुनौती दिनुहोस् र आफ्नो कामप्रति गर्व गर्नुहोस्।"
    url: "https://www.linkedin.com/posts/tim-cox-8695122b4_im-stoked-to-have-received-the-bachelor-ugcPost-7525764709963247616-8USR/"
