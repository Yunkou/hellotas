      ne: "यस्तो अद्भुत समुदायको हिस्सा हुन पाउनु सौभाग्य हो, र बाटोमा सानो योगदान दिन पाएकोमा मलाई गर्व छ।"
    summary:
      en: "Chhunly received the ICT Community Spirit Award, sponsored by Secret Lab, at the end of a university journey. Chhunly thanks the lecturers, staff and fellow students who helped along the way."
      zh: "在大学生活即将结束之际，Chhunly 获得了 Secret Lab 赞助的 ICT 社区精神奖。Chhunly 感谢一路给予支持的老师、教职员和同学。"
      ne: "विश्वविद्यालयको यात्रा सकिँदै गर्दा Chhunly ले Secret Lab प्रायोजित ICT Community Spirit Award पाउनुभयो। Chhunly सहयोग गर्ने लेक्चरर, कर्मचारी र साथी विद्यार्थीलाई धन्यवाद दिनुहुन्छ।"
    url: "https://www.linkedin.com/posts/chhunly-chhek-b626681b6_it-is-a-great-honour-to-have-received-ict-ugcPost-7525835319775064064-yqfe/"
