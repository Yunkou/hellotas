  zh: "GDG Hobart在UTAS举办的双场活动，主题是将AI投入生产，以及保护AI应用免受提示词注入攻击。"
  ne: "UTAS मा GDG Hobart को दोहोरो सत्र, AI लाई उत्पादनमा ल्याउने र AI एपलाई प्रम्प्ट इन्जेक्सनबाट सुरक्षित राख्ने विषयमा।"
