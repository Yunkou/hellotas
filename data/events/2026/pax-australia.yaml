  en: "UTAS Games students showcased their own games to thousands of PAX visitors on the Tasmanian booth in Melbourne."
  zh: "UTAS游戏专业学生在墨尔本的塔斯马尼亚展位上向数千名PAX参观者展示了自己的游戏。"
  ne: "UTAS का गेम्स विद्यार्थीहरूले मेलबर्नमा तस्मानियाली बुथमार्फत हजारौँ PAX आगन्तुकहरूलाई आफैँले बनाएका खेलहरू देखाए।"
