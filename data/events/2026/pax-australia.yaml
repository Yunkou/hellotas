      ne: "यो अवसर दिनुभएकोमा तस्मानिया विश्वविद्यालयलाई धन्यवाद। Callie र Harry सँगै जान पाएँ, र हामीले आफ्ना खेलहरू हजारौँ मानिसहरूलाई देखाउन सक्यौं।"
