about:
  en:
    - "PAX Australia 2026 was held from 9 to 11 October 2026 at the Melbourne Convention and Exhibition Centre (MCEC). As one of Australia's major gaming and interactive entertainment events, the three-day expo brought together game developers, publishers, industry professionals, and gaming enthusiasts to celebrate video games, tabletop gaming, and gaming culture."
    - "The event featured game exhibitions, hands-on demonstrations, industry panels, independent game showcases, and networking opportunities, allowing visitors to discover new games, interact with developers, and explore the wider gaming industry."
    - "University of Tasmania (UTAS) Games and Creative Technologies students Callie Kirkcaldie, Harry Beumer, and Nicholas Gammler showcased their student-developed games at the Tasmanian booth, alongside the university's Study Gamedev Online display. Featured projects included Brainless by Callie Kirkcaldie, Scrap'd by Nicholas Gammler, and Fantasy Lab Escape, developed by a team including Harry Beumer. Additional student games were available through the UTAS GOAT collection on itch.io."
    - "The showcase provided an opportunity for students to present their creative and technical achievements to a large public audience. By demonstrating their games and interacting with visitors, students gained experience communicating their design ideas, presenting gameplay, and engaging with the gaming community."
    - "Dr Lindsay Wells attended the event to promote UTAS's Games and Creative Technologies Major, while Professor Nicole Herbert acknowledged the students' contributions in representing the School of ICT."
    - "For current and prospective UTAS students, PAX Australia highlighted the value of applying game development knowledge beyond the classroom. Participating in a major gaming expo offered opportunities to develop professional presentation skills, showcase portfolios, connect with the Australian games industry, and explore potential career pathways in game development and creative technologies."
  zh:
    - "PAX Australia 2026 于 2026 年 10 月 9 日至 11 日在墨尔本会展中心（MCEC）举行。作为澳大利亚主要的游戏和互动娱乐盛会之一，这场为期三天的展会汇聚游戏开发者、发行商、业界人士和游戏爱好者，共同庆祝电子游戏、桌游和游戏文化。"
    - "展会设有游戏展览、动手试玩、行业座谈、独立游戏展示和社交机会，访客可以发现新游戏、与开发者交流，并了解更广阔的游戏行业。"
    - "University of Tasmania（UTAS）游戏与创意技术专业的学生 Callie Kirkcaldie、Harry Beumer 和 Nicholas Gammler 在塔斯马尼亚展位展示了自己开发的游戏，旁边还有学校的 Study Gamedev Online 展示。展出作品包括 Callie Kirkcaldie 的 Brainless、Nicholas Gammler 的 Scrap'd，以及 Harry Beumer 所在团队开发的 Fantasy Lab Escape。更多学生游戏可在 itch.io 上的 UTAS GOAT 合集中找到。"
    - "这次展示让学生有机会向大量公众展示自己的创意和技术成果。通过演示游戏、与访客互动，学生积累了讲解设计理念、展示玩法以及与游戏社区交流的经验。"
    - "Lindsay Wells 博士到场推广 UTAS 的游戏与创意技术专业，Nicole Herbert 教授也对学生代表 School of ICT 所作的贡献表示肯定。"
    - "对在读和未来的 UTAS 学生来说，PAX Australia 说明了在课堂之外运用游戏开发知识的价值。参加大型游戏展会让学生锻炼职业展示能力、展示作品集、结识澳大利亚游戏行业，并探索游戏开发和创意技术方面的职业道路。"
  ne:
    - "PAX Australia 2026, 9 देखि 11 अक्टोबर 2026 सम्म Melbourne Convention and Exhibition Centre (MCEC) मा सम्पन्न भयो। अस्ट्रेलियाको प्रमुख गेमिङ तथा अन्तरक्रियात्मक मनोरञ्जन कार्यक्रममध्ये एकका रूपमा यो तीन दिने एक्स्पोले गेम डेभलपर, प्रकाशक, उद्योगका पेसाकर्मी र गेमिङप्रेमीहरूलाई भिडियो गेम, टेबलटप गेम र गेमिङ संस्कृति मनाउन एकै ठाउँमा ल्यायो।"
    - "कार्यक्रममा गेम प्रदर्शनी, आफैं खेलेर हेर्न मिल्ने प्रदर्शन, उद्योग प्यानल, स्वतन्त्र गेमका शोकेस र नेटवर्किङका अवसरहरू थिए, जसले आगन्तुकहरूलाई नयाँ गेम पत्ता लगाउने, डेभलपरहरूसँग कुरा गर्ने र फराकिलो गेमिङ उद्योग बुझ्ने अवसर दिए।"
    - "University of Tasmania (UTAS) का Games and Creative Technologies विद्यार्थी Callie Kirkcaldie, Harry Beumer र Nicholas Gammler ले तस्मानियाको बुथमा विश्वविद्यालयको Study Gamedev Online प्रदर्शनीसँगै आफूले बनाएका गेमहरू प्रस्तुत गरे। प्रस्तुत परियोजनामा Callie Kirkcaldie को Brainless, Nicholas Gammler को Scrap'd र Harry Beumer सहितको टोलीले बनाएको Fantasy Lab Escape थिए। थप विद्यार्थी गेमहरू itch.io को UTAS GOAT संग्रहमा उपलब्ध थिए।"
    - "शोकेसले विद्यार्थीहरूलाई आफ्ना सिर्जनात्मक र प्राविधिक उपलब्धि ठूलो सार्वजनिक दर्शकसामु प्रस्तुत गर्ने अवसर दियो। गेम देखाउँदै र आगन्तुकहरूसँग कुरा गर्दै विद्यार्थीहरूले आफ्ना डिजाइनका विचार बताउने, गेमप्ले प्रस्तुत गर्ने र गेमिङ समुदायसँग जोडिने अनुभव पाए।"
    - "Dr Lindsay Wells UTAS को Games and Creative Technologies Major को प्रचार गर्न कार्यक्रममा उपस्थित थिए, र Professor Nicole Herbert ले School of ICT को प्रतिनिधित्व गरेकोमा विद्यार्थीहरूको योगदानको प्रशंसा गरिन्।"
    - "हाल अध्ययनरत र भावी UTAS विद्यार्थीहरूका लागि PAX Australia ले गेम विकासको ज्ञान कक्षाबाहिर प्रयोग गर्नुको महत्त्व देखायो। ठूलो गेमिङ एक्स्पोमा सहभागिताले पेसागत प्रस्तुति सीप विकास गर्ने, पोर्टफोलियो देखाउने, अस्ट्रेलियाको गेम उद्योगसँग जोडिने र गेम विकास तथा सिर्जनात्मक प्रविधिमा सम्भावित करियर मार्ग खोज्ने अवसर दियो।"
