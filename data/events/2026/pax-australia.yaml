      ne: "UTAS को सहयोगमा Nicholas Gammler सहपाठी Callie र Harry सँग PAX Australia गए र हजारौँ आगन्तुकलाई आफ्ना खेलहरू देखाए। पोस्टमा तीनै खेल Brainless, Fantasy Lab Escape र Scrap'd का लिंक छन्, र वर्षभरिको सहयोगका लागि Ian र Lindsay लाई धन्यवाद दिइएको छ।"
