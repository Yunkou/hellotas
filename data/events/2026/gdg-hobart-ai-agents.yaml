      ne: "Build with AI x The Future of Work with AI Agents को GDG Hobart को समीक्षा, जुन UTAS को Forest Building को नयाँ स्थलमा उनीहरूको पहिलो कार्यक्रम थियो। पोस्टले स्थल साझेदार UTAS, सुरक्षित ढोकामा चेक-इनदेखि नेटवर्किङसम्म सबै सम्हाल्ने आयोजक र स्वयंसेवकहरू, र प्रश्नोत्तरमा प्रश्न सोध्ने सहभागीहरूलाई धन्यवाद दिन्छ।"
