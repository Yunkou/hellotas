      ne: "Yu Wang ले AI एजेन्ट कार्यक्रम सञ्चालनमा सघाए: स्थानीय वक्ताहरू समन्वय गर्ने, प्रचार सामग्री बनाउने, स्थल-निर्देशन भिडियो तयार पार्ने र कोठा मिलाउने। सबैभन्दा खुसीको कुरा व्यवसाय, शिक्षा, लेखा लगायतका क्षेत्रका मानिसहरू IT पेसाकर्मीसँगै AI सिक्न आउनु थियो, र Graham Walker को प्रस्तुतिले AI मा निरन्तर आउने परिवर्तनसँग कसरी अघि बढ्ने भन्नेमा नयाँ दृष्टिकोण दियो।"
