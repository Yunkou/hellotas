outcome:
  en: "Two industry talks · hands-on Vertex AI session"
  zh: "两场行业演讲 · Vertex AI实践环节"
  ne: "दुई उद्योग प्रस्तुतिहरू · Vertex AI व्यावहारिक सत्र"
about:
  en:
    - "GDG Hobart hosted Build with AI x The Future of Work with AI Agents on 18 June 2026 at Room 2038, Level 2, The Forest Building, University of Tasmania, Hobart. It was GDG Hobart's first event at its new venue."
    - "The event featured two industry sessions exploring practical applications of artificial intelligence, responsible AI adoption, and the growing role of AI agents in the workplace."
    - "In the first session, It's Not the Model – It's Everything Around It, Graham Walker discussed the factors that determine whether AI projects succeed in real-world environments. Drawing on experience in regulated Australian industries, he explored data quality, privacy, security, compliance, accountability, and operational costs."
    - "The second session, Burnout to Boardroom: Architecting Your AI C-Suite with Vertex AI, was delivered by Anupam Phoghat, Founding Director of Core-X. This interactive workshop introduced participants to Google Vertex AI and Agent Builder, demonstrating how AI agents can collaborate to automate workflows, support business operations, and improve productivity."
    - "The event also provided networking opportunities for students, developers, and technology professionals from IT, business, education, accounting, and other fields in Hobart."
    - "For UTAS students, the event offered practical insights into AI agents, cloud-based development tools, responsible AI implementation, and emerging technology skills relevant to future ICT careers."
  zh:
    - "GDG Hobart 于 2026 年 6 月 18 日在霍巴特 University of Tasmania The Forest Building 二楼 2038 室举办了 Build with AI x The Future of Work with AI Agents。这是 GDG Hobart 在新场地举办的第一场活动。"
    - "活动包括两场行业分享，探讨人工智能的实际应用、负责任地采用 AI，以及 AI 智能体在职场中日益重要的作用。"
    - "第一场分享题为 It's Not the Model – It's Everything Around It（关键不在模型，而在模型之外的一切），由 Graham Walker 主讲，讨论决定 AI 项目能否在真实环境中成功的因素。他结合在澳大利亚受监管行业的经验，谈到了数据质量、隐私、安全、合规、问责和运营成本。"
    - "第二场 Burnout to Boardroom: Architecting Your AI C-Suite with Vertex AI 由 Core-X 创始董事 Anupam Phoghat 主讲。这个互动工作坊向参与者介绍了 Google Vertex AI 和 Agent Builder，演示多个 AI 智能体如何协作，实现工作流程自动化、支持业务运营并提高效率。"
    - "活动还为霍巴特来自 IT、商业、教育、会计等领域的学生、开发者和技术从业者提供了交流机会。"
    - "对 UTAS 学生来说，这次活动让他们实际了解 AI 智能体、云端开发工具、负责任的 AI 实施，以及未来 ICT 职业所需的新兴技术技能。"
  ne:
    - "GDG Hobart ले 18 जुन 2026 मा होबार्टमा University of Tasmania को The Forest Building को दोस्रो तलास्थित कोठा 2038 मा Build with AI x The Future of Work with AI Agents आयोजना गर्‍यो। यो नयाँ स्थानमा GDG Hobart को पहिलो कार्यक्रम थियो।"
    - "कार्यक्रममा कृत्रिम बुद्धिमत्ताको व्यावहारिक प्रयोग, जिम्मेवार ढंगले AI अपनाउने तरिका र कार्यस्थलमा AI एजेन्टहरूको बढ्दो भूमिकाबारे दुई उद्योग सत्र थिए।"
    - "पहिलो सत्र It's Not the Model – It's Everything Around It मा Graham Walker ले वास्तविक वातावरणमा AI परियोजना सफल हुने वा नहुने कुरा निर्धारण गर्ने कारकहरूबारे कुरा गरे। अस्ट्रेलियाका नियमन गरिएका उद्योगहरूको अनुभवका आधारमा उनले डेटाको गुणस्तर, गोपनीयता, सुरक्षा, नियम पालना, जवाफदेहिता र सञ्चालन खर्चबारे चर्चा गरे।"
    - "दोस्रो सत्र Burnout to Boardroom: Architecting Your AI C-Suite with Vertex AI, Core-X का संस्थापक निर्देशक Anupam Phoghat ले सञ्चालन गरे। यो अन्तरक्रियात्मक कार्यशालाले सहभागीहरूलाई Google Vertex AI र Agent Builder को परिचय दियो र AI एजेन्टहरूले मिलेर कसरी काम स्वचालित गर्न, व्यवसाय सञ्चालनमा सहयोग गर्न र उत्पादकत्व बढाउन सक्छन् भन्ने देखायो।"
    - "कार्यक्रमले होबार्टका IT, व्यवसाय, शिक्षा, लेखा र अन्य क्षेत्रका विद्यार्थी, डेभलपर र प्रविधि पेसाकर्मीहरूलाई नेटवर्किङको अवसर पनि दियो।"
    - "UTAS विद्यार्थीहरूका लागि कार्यक्रमले AI एजेन्ट, क्लाउडमा आधारित विकास उपकरण, जिम्मेवार AI कार्यान्वयन र भविष्यका ICT करियरका लागि उपयोगी नयाँ प्रविधि सीपबारे व्यावहारिक जानकारी दियो।"
student_voice:
  en: "What made me happiest was not just seeing the event run successfully, but seeing people from different backgrounds come together to learn about AI."
  zh: "最让我高兴的不仅是看到活动成功举办，而是看到来自不同背景的人们聚在一起学习AI。"
  ne: "मलाई सबैभन्दा खुशी लाग्ने कुरा कार्यक्रम सफलतापूर्वक सम्पन्न भयो भन्ने मात्र थिएन — विभिन्न पृष्ठभूमिबाट आएका मानिसहरू एकैठाउँ भेला भई AI सिक्नु थियो।"
