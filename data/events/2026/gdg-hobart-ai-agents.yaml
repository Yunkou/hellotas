      ne: "AI प्रति उत्सुक र यसले कामको भविष्यलाई कसरी आकार दिन्छ भनी बुझ्न इच्छुक यति धेरै मानिसहरूलाई देख्दा एकदम राम्रो लाग्यो।"
    summary:
      en: "Yu Wang helped run the AI agents night: coordinating local speakers, creating promotional material, making a venue guide video and setting up the room. The highlight was seeing people from business, education, accounting and other fields join IT professionals to learn about AI, and Graham Walker's talk offered a fresh way to think about keeping up with constant change in AI."
