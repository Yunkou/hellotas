  en: "GDG Hobart's first event at UTAS's Forest Building, on AI agents, responsible data use and the future of work."
  zh: "GDG Hobart在UTAS森林大楼举办的首次活动，主题为AI代理、负责任的数据使用和未来工作。"
  ne: "UTAS को The Forest Building मा GDG Hobart को पहिलो कार्यक्रम — AI एजेन्ट, जिम्मेवार डाटा प्रयोग र कामको भविष्यमा केन्द्रित।"
