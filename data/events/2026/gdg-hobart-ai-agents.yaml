    summary:
      en: "GDG Hobart's recap of Build with AI x The Future of Work with AI Agents, its first event at the new venue in UTAS's Forest Building. It thanks UTAS as venue partner, the organisers and volunteers who ran everything from secure-door check-in to networking, and the attendees for their questions in the Q&A."
