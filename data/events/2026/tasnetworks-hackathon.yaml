  zh: "为期三天的黑客松，UTAS学生针对TasNetworks提出的真实能源难题开发原型方案。"
  ne: "तीन दिने ह्याकाथन, जहाँ UTAS का विद्यार्थीहरूले TasNetworks ले दिएका वास्तविक ऊर्जा समस्याहरूका लागि प्रोटोटाइप बनाए।"
