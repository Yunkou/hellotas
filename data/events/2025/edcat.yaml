outcome:
  en: "Career advice from recruiters and early-career professionals"
  zh: "来自招聘方和职场新人的职业建议"
  ne: "भर्तीकर्ता र करियरको सुरुआती चरणका पेसाकर्मीहरूबाट करियर सल्लाह"
about:
  en:
    - "EdCAT 2025: Education, Careers and Technology Summit was held on Thursday 10 April 2025, from 8:15 AM to 6:00 PM, at Wrest Point in Sandy Bay, Hobart. Organised by the Australian Computer Society (ACS), the full-day summit brought together students, educators, technology professionals, and industry representatives to explore developments in technology, education, and career opportunities."
    - "The summit featured multiple conference streams covering career development, technology leadership, and education, alongside an industry exhibition. Attendees had opportunities to hear from professionals, explore industry perspectives, and connect with organisations involved in Tasmania's technology sector."
    - "A key highlight for UTAS ICT students was the dedicated career stream, which included a panel of early-career professionals associated with ACS, Hydro Tasmania, the Department of Premier and Cabinet, and the Department for Education. The panel provided insights into early career experiences and offered practical perspectives on preparing for employment in the ICT industry."
    - "The summit also featured discussions covering topics ranging from artificial intelligence development to job-hunting strategies. These sessions helped students connect their academic learning with industry developments while gaining a better understanding of the skills and preparation involved in entering the technology workforce."
    - "In a LinkedIn reflection, UTAS student Yu Wang highlighted the value of meeting industry professionals and fellow students, particularly appreciating the career stream for its practical advice and personal experiences. The reflection demonstrated how participation in industry events can help students develop confidence and gain a clearer understanding of their future career pathways."
    - "For UTAS ICT students, EdCAT 2025 provided an opportunity to broaden their knowledge of the technology industry, learn from professionals at different career stages, and build connections within Tasmania's ICT community. The event also highlighted the importance of professional networking, career preparation, and continuous learning when transitioning from university study into employment."
  zh:
    - "EdCAT 2025：教育、职业与技术峰会于 2025 年 4 月 10 日（星期四）上午 8:15 至下午 6:00 在霍巴特 Sandy Bay 的 Wrest Point 举行。这场由澳大利亚计算机协会（ACS）主办的全天峰会，汇聚学生、教育工作者、技术从业者和行业代表，共同探讨技术、教育和职业机会方面的发展。"
    - "峰会设有职业发展、技术领导力和教育等多个专场，并同时举办行业展览。与会者可以聆听业界人士的分享，了解行业观点，并结识塔斯马尼亚科技领域的各家机构。"
    - "对 UTAS ICT 学生来说，一大亮点是职业专场。专场邀请了来自 ACS、Hydro Tasmania、州长与内阁部以及教育部的职场新人组成座谈，分享入职初期的经历，并就如何为进入 ICT 行业做准备给出实用建议。"
    - "峰会的讨论话题从人工智能开发到求职策略都有涉及。这些分享帮助学生把课堂所学与行业发展联系起来，更清楚地了解进入科技行业需要的技能和准备。"
    - "UTAS 学生 Yu Wang 在 LinkedIn 上回顾时提到，能结识业界人士和同学很有收获，尤其喜欢职业专场里的实用建议和亲身经历。这也说明参加行业活动能帮助学生建立自信，更清楚地规划未来的职业道路。"
    - "对 UTAS ICT 学生来说，EdCAT 2025 让他们拓宽了对科技行业的认识，向处于不同职业阶段的专业人士学习，并在塔斯马尼亚 ICT 社区中建立人脉。活动也提醒大家，从大学走向职场时，职业社交、求职准备和持续学习都很重要。"
  ne:
    - "EdCAT 2025: शिक्षा, करियर तथा प्रविधि शिखर सम्मेलन बिहिबार 10 अप्रिल 2025 मा बिहान 8:15 देखि साँझ 6:00 सम्म होबार्टको Sandy Bay स्थित Wrest Point मा सम्पन्न भयो। Australian Computer Society (ACS) ले आयोजना गरेको यो पूरा दिनको सम्मेलनले विद्यार्थी, शिक्षक, प्रविधि पेसाकर्मी र उद्योगका प्रतिनिधिहरूलाई प्रविधि, शिक्षा र करियरका अवसरबारे छलफल गर्न एकै ठाउँमा ल्यायो।"
    - "सम्मेलनमा करियर विकास, प्रविधि नेतृत्व र शिक्षा समेट्ने विभिन्न सत्रहरू र उद्योग प्रदर्शनी थिए। सहभागीहरूले पेसाकर्मीहरूका कुरा सुन्ने, उद्योगको दृष्टिकोण बुझ्ने र तस्मानियाको प्रविधि क्षेत्रका संस्थाहरूसँग जोडिने अवसर पाए।"
    - "UTAS ICT विद्यार्थीहरूका लागि मुख्य आकर्षण छुट्टै करियर सत्र थियो, जसमा ACS, Hydro Tasmania, प्रिमियर तथा मन्त्रिपरिषद् विभाग र शिक्षा विभागसँग सम्बन्धित सुरुआती करियरका पेसाकर्मीहरूको प्यानल थियो। प्यानलले करियरको सुरुआती अनुभव सुनायो र ICT उद्योगमा रोजगारीका लागि तयारी गर्ने व्यावहारिक सल्लाह दियो।"
    - "सम्मेलनमा कृत्रिम बुद्धिमत्ता (AI) विकासदेखि जागिर खोज्ने रणनीतिसम्मका विषयमा छलफल भयो। यी सत्रहरूले विद्यार्थीहरूलाई कक्षाको ज्ञानलाई उद्योगको विकाससँग जोड्न र प्रविधि क्षेत्रमा प्रवेश गर्न चाहिने सीप र तयारी राम्ररी बुझ्न मद्दत गरे।"
    - "LinkedIn मा लेखेको अनुभवमा UTAS विद्यार्थी Yu Wang ले उद्योगका पेसाकर्मी र सहपाठीहरूलाई भेट्नुको महत्त्व उल्लेख गरे, विशेष गरी करियर सत्रका व्यावहारिक सल्लाह र व्यक्तिगत अनुभव मन परेको बताए। यसले उद्योगका कार्यक्रममा सहभागी हुँदा विद्यार्थीहरूको आत्मविश्वास बढ्ने र भविष्यको करियर मार्ग स्पष्ट हुने देखायो।"
    - "UTAS ICT विद्यार्थीहरूका लागि EdCAT 2025 ले प्रविधि उद्योगबारेको ज्ञान फराकिलो पार्ने, करियरका फरक चरणमा रहेका पेसाकर्मीहरूबाट सिक्ने र तस्मानियाको ICT समुदायमा सम्बन्ध बनाउने अवसर दियो। विश्वविद्यालयबाट रोजगारीतर्फ जाँदा पेसागत नेटवर्किङ, करियर तयारी र निरन्तर सिकाइ कति महत्त्वपूर्ण छन् भन्ने पनि यसले देखायो।"
student_voice:
  en: "I really appreciated the career stream session, which provided valuable advice and personal experiences. It definitely helped us better prepare for entering the workforce."
  zh: "我非常喜欢职业专场，它提供了宝贵的建议和亲身经历，确实帮助我们更好地为进入职场做准备。"
  ne: "मलाई करियर सत्र निकै मन पर्‍यो, जसले बहुमूल्य सल्लाह र व्यक्तिगत अनुभवहरू दियो। यसले हामीलाई कार्यक्षेत्रमा प्रवेश गर्न अझ राम्ररी तयार हुन पक्कै मद्दत गर्‍यो।"
