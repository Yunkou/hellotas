about:
  en:
    - "GDG Hobart hosted DevFest 2025: AI in Action and Career Insights on Wednesday 12 November 2025, from 5:15 PM to 6:45 PM, at the Centenary Building on the University of Tasmania's Sandy Bay Campus. The event brought together more than 25 developers, students, and technology enthusiasts for an evening of technical learning, career discussions, and community engagement."
    - "Oscar Wahltinez, a Senior Software Engineer at Google, travelled from Sydney to deliver a presentation on the practical applications of artificial intelligence and machine learning. His session included real-world examples and an interactive AI game, providing attendees with an engaging introduction to how AI technologies can be applied in practice."
    - "The event also featured UTAS alumni Amber Nguyen from Hydro Tasmania and Pul Khut from the Department of Police, Fire and Emergency Management. Both speakers shared their experiences transitioning from university into professional roles in the technology industry, offering insights into career development and how artificial intelligence is influencing career pathways."
    - "An interactive question-and-answer session provided attendees with an opportunity to engage with the speakers, explore career-related questions, and gain perspectives on entering Tasmania's technology workforce."
    - "Beyond the presentations, DevFest 2025 encouraged connections among students, graduates, and local technology professionals. The University of Tasmania supported the event by providing the venue, helping bring together members of Hobart's developer community."
    - "For UTAS ICT students, the event offered opportunities to explore practical AI applications, learn from the career experiences of university graduates, and develop a broader understanding of employment pathways in the technology industry. It also highlighted the value of participating in local developer communities to build professional connections and stay informed about emerging technologies."
  zh:
    - "GDG Hobart 于 2025 年 11 月 12 日（星期三）下午 5:15 至 6:45 在 University of Tasmania Sandy Bay 校区的 Centenary Building 举办了 DevFest 2025：AI in Action and Career Insights。活动吸引了 25 位以上的开发者、学生和技术爱好者，共度一个学习技术、探讨职业和社区交流的夜晚。"
    - "Google 高级软件工程师 Oscar Wahltinez 专程从悉尼赶来，介绍人工智能和机器学习的实际应用。他的分享结合真实案例和一个互动 AI 游戏，让与会者生动地了解 AI 技术如何落地。"
    - "活动还邀请了两位 UTAS 校友：来自 Hydro Tasmania 的 Amber Nguyen，以及来自警察、消防与应急管理部的 Pul Khut。他们分享了从大学走向科技行业职位的经历，谈到职业发展，以及人工智能如何影响职业道路。"
    - "互动问答环节让与会者可以直接向嘉宾提问，探讨职业相关问题，了解如何进入塔斯马尼亚的科技行业。"
    - "除了演讲，DevFest 2025 也促进了学生、毕业生和本地技术从业者之间的交流。University of Tasmania 提供了场地，帮助霍巴特的开发者社区聚在一起。"
    - "对 UTAS ICT 学生来说，这次活动让他们了解 AI 的实际应用，从校友的职业经历中学习，更全面地认识科技行业的就业途径。活动也说明，参与本地开发者社区有助于建立职业人脉，并及时了解新兴技术。"
  ne:
    - "GDG Hobart ले बुधबार 12 नोभेम्बर 2025 मा साँझ 5:15 देखि 6:45 सम्म University of Tasmania को Sandy Bay क्याम्पसस्थित Centenary Building मा DevFest 2025: AI in Action and Career Insights आयोजना गर्‍यो। कार्यक्रममा 25 भन्दा बढी डेभलपर, विद्यार्थी र प्रविधिप्रेमी प्राविधिक सिकाइ, करियर छलफल र सामुदायिक भेटघाटको साँझका लागि भेला भए।"
    - "Google का Senior Software Engineer Oscar Wahltinez सिड्नीबाट आएर कृत्रिम बुद्धिमत्ता र मेसिन लर्निङको व्यावहारिक प्रयोगबारे प्रस्तुति दिए। वास्तविक उदाहरण र एउटा अन्तरक्रियात्मक AI खेल समेटिएको उनको सत्रले AI प्रविधि व्यवहारमा कसरी प्रयोग हुन्छ भन्ने रोचक ढंगले देखायो।"
    - "कार्यक्रममा UTAS का पूर्व विद्यार्थीहरू Hydro Tasmania की Amber Nguyen र प्रहरी, दमकल तथा आपतकालीन व्यवस्थापन विभागका Pul Khut पनि थिए। दुवैले विश्वविद्यालयबाट प्रविधि उद्योगको पेसागत भूमिकामा पुग्दाको अनुभव सुनाए, करियर विकास र AI ले करियर मार्गमा पारिरहेको प्रभावबारे कुरा गरे।"
    - "अन्तरक्रियात्मक प्रश्नोत्तर सत्रले सहभागीहरूलाई वक्ताहरूसँग सिधै कुरा गर्ने, करियरसम्बन्धी प्रश्न सोध्ने र तस्मानियाको प्रविधि क्षेत्रमा प्रवेश गर्नेबारे दृष्टिकोण पाउने अवसर दियो।"
    - "प्रस्तुतिबाहेक, DevFest 2025 ले विद्यार्थी, स्नातक र स्थानीय प्रविधि पेसाकर्मीबीच सम्बन्ध बढायो। University of Tasmania ले स्थान उपलब्ध गराएर होबार्टको डेभलपर समुदायलाई एकै ठाउँमा ल्याउन सहयोग गर्‍यो।"
    - "UTAS ICT विद्यार्थीहरूका लागि यो कार्यक्रमले AI को व्यावहारिक प्रयोग बुझ्ने, स्नातकहरूको करियर अनुभवबाट सिक्ने र प्रविधि उद्योगका रोजगारीका मार्गहरू फराकिलो रूपमा बुझ्ने अवसर दियो। पेसागत सम्बन्ध बनाउन र नयाँ प्रविधिबारे जानकार रहन स्थानीय डेभलपर समुदायमा सहभागी हुनुको महत्त्व पनि यसले देखायो।"
