summary:
  en: "GDG Hobart's DevFest at UTAS, with a Google engineer on AI in practice and UTAS alumni on moving from university into tech."
  zh: "GDG Hobart在UTAS举办的DevFest,Google工程师讲解AI实践，UTAS校友分享从大学进入科技行业的经验。"
  ne: "UTAS मा आयोजित GDG Hobart को DevFest — Google इन्जिनियरबाट व्यवहारिक AI, र UTAS पूर्वविद्यार्थीहरूबाट विश्वविद्यालयदेखि प्रविधि उद्योगसम्मको यात्राको अनुभव।"
