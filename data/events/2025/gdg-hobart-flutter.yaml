summary:
  en: "A GDG Hobart community workshop at UTAS where attendees built their first cross-platform Flutter app in the cloud."
  zh: "GDG Hobart在UTAS举办的社区工作坊，参与者在云端搭建了自己的第一个跨平台Flutter应用。"
  ne: "UTAS मा GDG Hobart को सामुदायिक कार्यशाला, जहाँ सहभागीहरूले क्लाउडमा आफ्नो पहिलो क्रस-प्लेटफर्म Flutter एप बनाए।"
