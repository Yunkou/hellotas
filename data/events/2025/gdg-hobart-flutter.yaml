about:
  en:
    - "GDG Hobart hosted Flutter in 2025: Learn What Matters, Build What Works on Wednesday 17 September 2025, from 5:15 PM to 7:15 PM, in Room 134 of the Centenary Building at the University of Tasmania's Sandy Bay Campus. The workshop welcomed developers, ICT students, beginners, and members of Hobart's technology community interested in mobile application development."
    - "The event attracted more than 35 attendees and featured technical sessions led by Dr Lindsay Wells, a Lecturer in ICT at UTAS, and Luke Moody. The sessions introduced Flutter development and explored important concepts and practical approaches for beginners learning to build cross-platform applications."
    - "A key highlight was the hands-on workshop led by Dr Lindsay Wells, during which attendees set up and ran their first Flutter project using GitHub Codespaces. This cloud-based development environment allowed participants to gain practical experience with Flutter without needing to configure a complete local development setup."
    - "The evening was co-hosted by Roshani Ghimire and Yu Wang, bringing together students, developers, and technology enthusiasts for collaborative learning and community engagement. The workshop provided opportunities for participants to explore new development tools, exchange experiences, and connect with other members of Hobart's developer community."
    - "For UTAS ICT students, the workshop offered an opportunity to develop practical skills in cross-platform application development, gain experience using cloud-based development tools, and learn directly from experienced speakers. It also highlighted the value of engaging with local technology communities to strengthen technical knowledge, build professional connections, and explore potential career pathways in software and mobile application development."
  zh:
    - "GDG Hobart 于 2025 年 9 月 17 日（星期三）下午 5:15 至 7:15 在 University of Tasmania Sandy Bay 校区 Centenary Building 134 室举办了 Flutter in 2025：Learn What Matters, Build What Works 工作坊，欢迎对移动应用开发感兴趣的开发者、ICT 学生、初学者和霍巴特科技社区成员参加。"
    - "活动吸引了 35 位以上的参与者，技术分享由 UTAS ICT 讲师 Lindsay Wells 博士和 Luke Moody 主讲，介绍了 Flutter 开发，并讲解初学者构建跨平台应用时需要掌握的重要概念和实用方法。"
    - "一大亮点是 Lindsay Wells 博士带领的动手环节：与会者使用 GitHub Codespaces 创建并运行了自己的第一个 Flutter 项目。借助这个云端开发环境，大家无需配置完整的本地开发环境，就能亲手体验 Flutter。"
    - "当晚由 Roshani Ghimire 和 Yu Wang 共同主持，学生、开发者和技术爱好者一起学习、交流。工作坊让参与者尝试新的开发工具、分享经验，并结识霍巴特开发者社区的其他成员。"
    - "对 UTAS ICT 学生来说，这次工作坊帮助他们掌握跨平台应用开发的实用技能，熟悉云端开发工具，并直接向经验丰富的讲者学习。活动也说明，参与本地科技社区有助于加深技术知识、建立职业人脉，并探索软件和移动应用开发方面的职业道路。"
  ne:
    - "GDG Hobart ले बुधबार 17 सेप्टेम्बर 2025 मा साँझ 5:15 देखि 7:15 सम्म University of Tasmania को Sandy Bay क्याम्पसस्थित Centenary Building को कोठा 134 मा Flutter in 2025: Learn What Matters, Build What Works कार्यशाला आयोजना गर्‍यो। मोबाइल एप विकासमा रुचि राख्ने डेभलपर, ICT विद्यार्थी, नयाँ सिक्नेहरू र होबार्टको प्रविधि समुदायका सदस्यहरूलाई कार्यशालामा स्वागत गरियो।"
    - "कार्यक्रममा 35 भन्दा बढी सहभागी थिए र UTAS का ICT लेक्चरर Dr Lindsay Wells तथा Luke Moody ले प्राविधिक सत्र चलाए। सत्रहरूले Flutter विकासको परिचय दिए र क्रस-प्लेटफर्म एप बनाउन सिक्दै गरेकाहरूका लागि महत्त्वपूर्ण अवधारणा र व्यावहारिक तरिकाहरू बताए।"
    - "मुख्य आकर्षण Dr Lindsay Wells ले चलाएको व्यावहारिक कार्यशाला थियो, जहाँ सहभागीहरूले GitHub Codespaces प्रयोग गरेर आफ्नो पहिलो Flutter परियोजना सेटअप गरी चलाए। यो क्लाउडमा आधारित विकास वातावरणले पूरा स्थानीय सेटअप नगरीकनै Flutter को व्यावहारिक अनुभव लिन सम्भव बनायो।"
    - "साँझको कार्यक्रम Roshani Ghimire र Yu Wang ले सह-सञ्चालन गरे, जसले विद्यार्थी, डेभलपर र प्रविधिप्रेमीहरूलाई सँगै सिक्न र समुदायमा घुलमिल हुन एकै ठाउँमा ल्यायो। कार्यशालाले नयाँ विकास उपकरण चलाउने, अनुभव साटासाट गर्ने र होबार्टको डेभलपर समुदायका अरू सदस्यहरूसँग जोडिने अवसर दियो।"
    - "UTAS ICT विद्यार्थीहरूका लागि कार्यशालाले क्रस-प्लेटफर्म एप विकासमा व्यावहारिक सीप बढाउने, क्लाउडमा आधारित विकास उपकरण चलाउने अनुभव लिने र अनुभवी वक्ताहरूबाट सिधै सिक्ने अवसर दियो। प्राविधिक ज्ञान बलियो बनाउन, पेसागत सम्बन्ध बनाउन र सफ्टवेयर तथा मोबाइल एप विकासमा करियर मार्ग खोज्न स्थानीय प्रविधि समुदायसँग जोडिनुको महत्त्व पनि यसले देखायो।"
