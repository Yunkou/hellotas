about:
  en:
    - "The University of Tasmania (UTAS) School of ICT hosted its Semester 2 Connect & Collaborate Expo on Tuesday 28 October 2025 at the Studio Theatre and Stanley Burbury Theatre, University Centre, Sandy Bay Campus, Hobart. The event featured a daytime program from 11:00 AM to 2:00 PM and an evening session from 5:30 PM to 7:30 PM."
    - "Building on the success of the Semester 1 showcase, the expo brought together 20 Bachelor's and Master's student project teams, industry representatives, researchers, university staff, alumni, and current and prospective students. The event showcased student achievements, industry collaboration, and opportunities for research and professional engagement."
    - "Students presented final-semester projects developed in collaboration with industry clients, demonstrating how ICT knowledge and technical skills could be applied to practical challenges. Featured projects included Student Information ChatBot (UTAS ICT CourseMate), an IBM watsonx-powered chatbot designed to assist students with course and enrolment information; Paramedic Insights, a React and .NET visual analytics dashboard for identifying trends in controlled drug records; TechMate TAS, a Flutter and Firebase mobile application connecting students and technology professionals through events, job opportunities, and community information; and Brainy Hacks, a collection of adaptive brain-training games developed for children with learning difficulties."
    - "Alongside the student project demonstrations, the expo featured games, graphics, and mixed reality projects. Strategic panel discussions explored the role of ICT in addressing challenges related to education, climate, and productivity. A research poster session, presented through a speed-dating format, provided opportunities for attendees to engage with ICT researchers and explore potential research collaborations."
    - "The evening program included lightning talks covering artificial intelligence, cybersecurity, and gaming. Open to the public, these sessions encouraged knowledge sharing and discussion among students, researchers, industry professionals, and members of Tasmania's wider technology community."
    - "Event organiser Dr Lindsay Wells highlighted the strong participation of industry representatives, alumni, and current and prospective students. His contribution to organising and leading the expo was also recognised through the School's Outstanding Contribution to the School's Reputation award."
    - "For UTAS ICT students, the expo provided opportunities to present their technical achievements, demonstrate teamwork and problem-solving skills, communicate with industry professionals, and explore future career pathways. It also highlighted the importance of industry-connected projects, research engagement, and professional networking in preparing students for careers in the ICT sector."
  zh:
    - "University of Tasmania（UTAS）School of ICT 于 2025 年 10 月 28 日（星期二）在霍巴特 Sandy Bay 校区大学中心的 Studio Theatre 和 Stanley Burbury Theatre 举办了第二学期 Connect & Collaborate Expo。活动分为上午 11:00 至下午 2:00 的日间场，以及下午 5:30 至晚上 7:30 的晚间场。"
    - "在第一学期展会成功的基础上，这次展会汇聚了 20 支本科和硕士学生项目团队、行业代表、研究人员、大学教职员、校友，以及在读和准备入学的学生，展示了学生成果、产学合作，以及研究和职业交流的机会。"
    - "学生们展示了与行业客户合作完成的毕业学期项目，说明 ICT 知识和技术能力可以如何用于解决实际问题。重点项目包括：Student Information ChatBot（UTAS ICT CourseMate），一款基于 IBM watsonx、帮助学生查询课程和选课信息的聊天机器人；Paramedic Insights，一个用 React 和 .NET 构建、用于发现管制药品记录趋势的可视化分析仪表板；TechMate TAS，一款用 Flutter 和 Firebase 开发的移动应用，通过活动、工作机会和社区信息把学生与技术从业者联系起来；以及 Brainy Hacks，一套为有学习困难的儿童开发的自适应脑力训练游戏。"
    - "除了学生项目演示，展会还展出了游戏、图形和混合现实项目。战略座谈探讨了 ICT 在应对教育、气候和生产力挑战中的作用。研究海报环节采用“快速约会”形式，让与会者可以与 ICT 研究人员交流，探索潜在的研究合作。"
    - "晚间场安排了涵盖人工智能、网络安全和游戏的闪电演讲。这些面向公众开放的分享，促进了学生、研究人员、业界人士和塔斯马尼亚更广泛科技社区成员之间的知识交流与讨论。"
    - "活动组织者 Lindsay Wells 博士强调了行业代表、校友以及在读和准备入学学生的踊跃参与。他在组织和主持展会方面的贡献，也获得了学院的 Outstanding Contribution to the School's Reputation（学院声誉杰出贡献）奖。"
    - "对 UTAS ICT 学生来说，这次展会让他们展示技术成果，体现团队合作和解决问题的能力，与业界人士交流，并探索未来的职业道路。活动也说明了与行业挂钩的项目、参与研究和职业社交对于准备进入 ICT 行业的重要性。"
  ne:
    - "University of Tasmania (UTAS) को School of ICT ले मङ्गलबार 28 अक्टोबर 2025 मा होबार्टको Sandy Bay क्याम्पसस्थित University Centre को Studio Theatre र Stanley Burbury Theatre मा सेमेस्टर 2 को Connect & Collaborate Expo आयोजना गर्‍यो। कार्यक्रममा बिहान 11:00 देखि दिउँसो 2:00 सम्म दिउँसोको कार्यक्रम र साँझ 5:30 देखि 7:30 सम्म साँझको सत्र थियो।"
    - "सेमेस्टर 1 को शोकेसको सफलतालाई अघि बढाउँदै, एक्स्पोले स्नातक र स्नातकोत्तरका 20 विद्यार्थी परियोजना टोली, उद्योगका प्रतिनिधि, अनुसन्धानकर्ता, विश्वविद्यालयका कर्मचारी, पूर्व विद्यार्थी, र हाल अध्ययनरत तथा भावी विद्यार्थीहरूलाई एकै ठाउँमा ल्यायो। कार्यक्रमले विद्यार्थीका उपलब्धि, उद्योगसँगको सहकार्य, र अनुसन्धान तथा पेसागत संलग्नताका अवसरहरू देखायो।"
    - "विद्यार्थीहरूले उद्योगका ग्राहकहरूसँग मिलेर बनाएका अन्तिम सेमेस्टरका परियोजनाहरू प्रस्तुत गरे, जसले ICT ज्ञान र प्राविधिक सीपलाई व्यावहारिक चुनौतीमा कसरी प्रयोग गर्न सकिन्छ भन्ने देखायो। प्रमुख परियोजनाहरूमा Student Information ChatBot (UTAS ICT CourseMate), विद्यार्थीलाई कोर्स र भर्नासम्बन्धी जानकारीमा सहयोग गर्ने IBM watsonx मा आधारित च्याटबट; Paramedic Insights, नियन्त्रित औषधिका रेकर्डमा प्रवृत्ति पत्ता लगाउन React र .NET मा बनेको भिजुअल एनालिटिक्स ड्यासबोर्ड; TechMate TAS, कार्यक्रम, जागिरका अवसर र सामुदायिक जानकारीमार्फत विद्यार्थी र प्रविधि पेसाकर्मीलाई जोड्ने Flutter र Firebase मा बनेको मोबाइल एप; र Brainy Hacks, सिकाइमा कठिनाइ भएका बालबालिकाका लागि बनाइएका अनुकूलनशील दिमागी अभ्यासका गेमहरू थिए।"
    - "विद्यार्थी परियोजनाका प्रदर्शनसँगै एक्स्पोमा गेम, ग्राफिक्स र मिश्रित यथार्थ (mixed reality) परियोजनाहरू पनि थिए। रणनीतिक प्यानल छलफलले शिक्षा, जलवायु र उत्पादकत्वसम्बन्धी चुनौती समाधानमा ICT को भूमिकाबारे छलफल गर्‍यो। स्पीड-डेटिङ ढाँचामा भएको अनुसन्धान पोस्टर सत्रले सहभागीहरूलाई ICT अनुसन्धानकर्ताहरूसँग कुरा गर्ने र सम्भावित अनुसन्धान सहकार्य खोज्ने अवसर दियो।"
    - "साँझको कार्यक्रममा कृत्रिम बुद्धिमत्ता, साइबर सुरक्षा र गेमिङबारे छोटा लाइटनिङ टकहरू थिए। सबैका लागि खुला यी सत्रहरूले विद्यार्थी, अनुसन्धानकर्ता, उद्योगका पेसाकर्मी र तस्मानियाको फराकिलो प्रविधि समुदायबीच ज्ञान साटासाट र छलफललाई प्रोत्साहन गरे।"
    - "कार्यक्रमका आयोजक Dr Lindsay Wells ले उद्योगका प्रतिनिधि, पूर्व विद्यार्थी, र हाल अध्ययनरत तथा भावी विद्यार्थीहरूको उत्साहजनक सहभागितालाई उल्लेख गरे। एक्स्पो आयोजना र नेतृत्वमा उनको योगदानलाई School's Outstanding Contribution to the School's Reputation पुरस्कारबाट पनि सम्मान गरियो।"
    - "UTAS ICT विद्यार्थीहरूका लागि एक्स्पोले आफ्ना प्राविधिक उपलब्धि प्रस्तुत गर्ने, टिमवर्क र समस्या समाधान सीप देखाउने, उद्योगका पेसाकर्मीहरूसँग कुरा गर्ने र भविष्यका करियर मार्ग खोज्ने अवसर दियो। ICT क्षेत्रमा करियरको तयारीका लागि उद्योगसँग जोडिएका परियोजना, अनुसन्धानमा संलग्नता र पेसागत नेटवर्किङको महत्त्व पनि यसले देखायो।"
