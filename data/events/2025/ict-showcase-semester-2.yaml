    content:
      en: "Our students did an incredible job showcasing their hard work which caps off the end of their degree, as did our HDR and honours students and staff showcasing their research."
      zh: "我们的学生出色地展示了为学位画上句号的努力成果，研究生、荣誉学位学生和教职员工也展示了他们的研究。"
      ne: "हाम्रा विद्यार्थीहरूले आफ्नो डिग्रीको अन्त्यमा गरेको मेहनत उत्कृष्ट रूपमा प्रदर्शन गरे, र हाम्रा HDR तथा अनर्स विद्यार्थी र कर्मचारीहरूले पनि आफ्नो अनुसन्धान प्रस्तुत गरे।"
    summary:
      en: "Lindsay Wells thanks everyone who attended the Connect & Collaborate Expo in October, which drew industry members, alumni, and current and future students. The post credits the organising team and Head of School Nicole Herbert, and highlights the graduating students' projects, research from HDR and honours students, and panels on education, climate and productivity."
      zh: "Lindsay Wells感谢所有参加10月Connect & Collaborate展示会的来宾，包括业界人士、校友以及在读和未来的学生。帖子感谢了组织团队和院长Nicole Herbert，并重点介绍了毕业生的项目、研究生和荣誉学位学生的研究，以及关于教育、气候和生产力的座谈。"
      ne: "Lindsay Wells ले अक्टोबरको Connect & Collaborate एक्स्पोमा आउनुभएका सबैलाई धन्यवाद दिन्छन्, जहाँ उद्योगका सदस्य, पूर्वविद्यार्थी र वर्तमान तथा भावी विद्यार्थीहरू आएका थिए। पोस्टले आयोजक टोली र विद्यालय प्रमुख Nicole Herbert लाई श्रेय दिन्छ, र स्नातक हुन लागेका विद्यार्थीका प्रोजेक्ट, HDR तथा अनर्स विद्यार्थीका अनुसन्धान, र शिक्षा, जलवायु तथा उत्पादकत्वसम्बन्धी प्यानललाई उजागर गर्छ।"
    url: "https://www.linkedin.com/posts/lindsay-wells-24658b76_a-bit-of-an-overdue-post-because-ive-been-ugcPost-7397093381115588608-d02w/"
  - name: "Yu Wang"
    role:
      en: "Master of IT and Systems student at UTAS (now ICT Graduate at TasWater)"
      zh: "UTAS信息技术与系统硕士学生（现为TasWater ICT毕业生）"
      ne: "UTAS मा सूचना प्रविधि तथा प्रणालीका स्नातकोत्तर विद्यार्थी (अहिले TasWater मा ICT ग्राजुएट)"
    avatar: "/images/events/2025/ict-showcase-semester-2/linkedin-yu-wang-avatar.jpg"
    images:
      - "/images/events/2025/ict-showcase-semester-2/linkedin-yu-wang-1.jpg"
      - "/images/events/2025/ict-showcase-semester-2/linkedin-yu-wang-2.jpg"
      - "/images/events/2025/ict-showcase-semester-2/linkedin-yu-wang-3.jpg"
      - "/images/events/2025/ict-showcase-semester-2/linkedin-yu-wang-4.jpg"
      - "/images/events/2025/ict-showcase-semester-2/linkedin-yu-wang-5.jpg"
      - "/images/events/2025/ict-showcase-semester-2/linkedin-yu-wang-6.jpg"
    content:
      en: "We completed the entire project within twelve weeks using the Scrum methodology. During this time, we enhanced our teamwork and communication skills, learned to collaborate effectively with clients from requirement gathering to final delivery, and adapted quickly to challenges."
      zh: "我们用Scrum方法在十二周内完成了整个项目。在此期间，我们提升了团队合作和沟通能力，学会了从需求收集到最终交付与客户高效协作，并能快速应对挑战。"
      ne: "हामीले Scrum पद्धति प्रयोग गरी बाह्र हप्ताभित्र सम्पूर्ण प्रोजेक्ट पूरा गर्‍यौँ। यस अवधिमा हामीले टोलीकार्य र सञ्चार सीप बढायौँ, आवश्यकता सङ्कलनदेखि अन्तिम हस्तान्तरणसम्म क्लाइन्टसँग प्रभावकारी सहकार्य गर्न सिक्यौँ, र चुनौतीहरूमा छिटो अनुकूलन गर्‍यौँ।"
    summary:
      en: "Yu Wang's team showcased their final-year project, the UTAS ICT CourseMate Chatbot, which helps prospective Bachelor and Master's ICT students explore courses before enrolling. It draws on UTAS FAQs and course content, demonstrates timetable changes with simulated data, and was built in twelve weeks with Scrum using IBM watsonx Orchestrate, IBM Discovery and React."
      zh: "Yu Wang的团队展示了他们的毕业项目UTAS ICT CourseMate聊天机器人，帮助准备就读的ICT本科和硕士学生在注册前了解课程。它基于UTAS常见问题和课程内容，用模拟数据演示调整课表，并在十二周内用Scrum方法、基于IBM watsonx Orchestrate、IBM Discovery和React构建完成。"
      ne: "Yu Wang को टोलीले आफ्नो अन्तिम वर्षको प्रोजेक्ट UTAS ICT CourseMate च्याटबट प्रदर्शन गर्‍यो, जसले भर्ना हुन चाहने ICT स्नातक तथा स्नातकोत्तर विद्यार्थीहरूलाई भर्नाअघि पाठ्यक्रम बुझ्न मद्दत गर्छ। यसले UTAS का FAQ र पाठ्यक्रम सामग्री प्रयोग गर्छ, नमुना डाटाबाट समयतालिका परिवर्तन देखाउँछ, र IBM watsonx Orchestrate, IBM Discovery र React प्रयोग गरी Scrum पद्धतिमा बाह्र हप्तामा बनाइएको हो।"
    url: "https://www.linkedin.com/posts/yu-wang-solana_universityoftasmania-utas-schoolofict-ugcPost-7389063534384455680-E0nF/"
