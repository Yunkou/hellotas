summary:
  en: "A full-day TasICT technology conference featuring keynote speakers, industry discussions, a Tech Expo and networking opportunities."
  zh: "TasICT 主办的全天科技大会，包括主题演讲、行业讨论、Tech Expo 科技展和社交机会。"
  ne: "मुख्य वक्ता, उद्योग छलफल, Tech Expo र नेटवर्किङका अवसर समेटिएको TasICT को पूरा दिनको प्रविधि सम्मेलन।"
