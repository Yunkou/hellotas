about:
  en:
    - "The ICT Capstone Project Expo 2025 (Semester 1) was held on Wednesday 28 May 2025, from 10:00 AM to 12:00 PM, at the Studio Theatre, University Centre, University of Tasmania's Sandy Bay Campus in Hobart. Organised by Dr Lindsay Wells, the event marked the return of the School of ICT's Demo Day after more than a decade, providing an opportunity for students to showcase their work to university staff, alumni, and industry professionals."
    - "The expo featured live demonstrations from KIT300 Capstone Project teams, including student-developed mobile applications, websites, and games. Additional projects from KIT109 Games Fundamentals, KIT207 Games Design and Production, KIT305/KIT721 Mobile Application Development, KIT208 Virtual and Mixed Reality, and KIT307 Computer Graphics and Animation were also presented, highlighting the range of practical and creative work undertaken by ICT students."
    - "The exhibition showcased a variety of student projects, including SeaTalk, smart recycling systems, price-comparison websites, and creative games, as highlighted in a LinkedIn reflection by UTAS student Yu Wang. Yu Wang also shared a personal experience of presenting an application developed for the Mobile Application Development unit, reflecting progress in programming and practical application development."
    - "Visitors had opportunities to explore live demonstrations, interact with student developers, and learn about the ideas and technologies behind their projects. A digital event program also provided access to project posters, demonstration videos, and playable games, allowing attendees to engage with the students' work in different formats."
    - "The expo encouraged connections between current students, university staff, graduates, and industry representatives. The participation of returning alumni demonstrated the ongoing relationship between the School of ICT and its graduate community, while providing students with opportunities to present their achievements and develop professional communication skills."
    - "Following the successful event, the School of ICT announced plans for a second showcase in October 2025, with approximately twice as many projects expected to be featured."
    - "For UTAS ICT students, the ICT Capstone Project Expo 2025 provided a valuable opportunity to demonstrate practical skills, gain experience presenting technical projects, and engage with the local ICT community. It also highlighted the importance of teamwork, creativity, and applying classroom knowledge to practical software development challenges."
  zh:
    - "ICT Capstone Project Expo 2025（第一学期）于 2025 年 5 月 28 日（星期三）上午 10:00 至中午 12:00 在霍巴特 University of Tasmania Sandy Bay 校区大学中心 Studio Theatre 举行。活动由 Lindsay Wells 博士组织，标志着 School of ICT 的 Demo Day 在停办十多年后重新举办，让学生向大学教职员、校友和业界人士展示自己的作品。"
    - "展会上，KIT300 毕业设计团队现场演示了学生开发的移动应用、网站和游戏。KIT109 游戏基础、KIT207 游戏设计与制作、KIT305/KIT721 移动应用开发、KIT208 虚拟与混合现实以及 KIT307 计算机图形与动画等课程的项目也一同展出，体现了 ICT 学生在实践和创意方面的广泛成果。"
    - "正如 UTAS 学生 Yu Wang 在 LinkedIn 上回顾的那样，展出的学生项目十分多样，包括 SeaTalk、智能回收系统、比价网站和充满创意的游戏。Yu Wang 也分享了展示自己为移动应用开发课程制作的应用的经历，体现了他在编程和实际应用开发方面的进步。"
    - "参观者可以观看现场演示，与学生开发者交流，了解项目背后的想法和技术。活动还提供电子手册，收录项目海报、演示视频和可试玩的游戏，让大家以不同方式了解学生的作品。"
    - "展会促进了在读学生、大学教职员、毕业生和行业代表之间的交流。校友回校参加，体现了 School of ICT 与毕业生群体之间持续的联系，也让学生有机会展示成果、锻炼职业沟通能力。"
    - "活动取得成功后，School of ICT 宣布计划在 2025 年 10 月举办第二场展会，预计展出项目数量约为本次的两倍。"
    - "对 UTAS ICT 学生来说，ICT Capstone Project Expo 2025 是展示实践能力、积累技术项目展示经验，并与本地 ICT 社区交流的宝贵机会。活动也说明了团队合作、创造力，以及把课堂知识用于解决实际软件开发问题的重要性。"
  ne:
    - "ICT Capstone Project Expo 2025 (सेमेस्टर 1) बुधबार 28 मे 2025 मा बिहान 10:00 देखि मध्यान्ह 12:00 सम्म होबार्टमा University of Tasmania को Sandy Bay क्याम्पसको University Centre स्थित Studio Theatre मा सम्पन्न भयो। Dr Lindsay Wells ले आयोजना गरेको यो कार्यक्रमसँगै School of ICT को Demo Day एक दशकभन्दा बढी समयपछि फेरि सुरु भयो, जसले विद्यार्थीहरूलाई आफ्नो काम विश्वविद्यालयका कर्मचारी, पूर्व विद्यार्थी र उद्योगका पेसाकर्मीहरूलाई देखाउने अवसर दियो।"
    - "एक्स्पोमा KIT300 Capstone Project टोलीहरूले विद्यार्थीले बनाएका मोबाइल एप, वेबसाइट र गेमहरूको प्रत्यक्ष प्रदर्शन गरे। KIT109 Games Fundamentals, KIT207 Games Design and Production, KIT305/KIT721 Mobile Application Development, KIT208 Virtual and Mixed Reality र KIT307 Computer Graphics and Animation का परियोजनाहरू पनि प्रस्तुत गरिए, जसले ICT विद्यार्थीहरूको व्यावहारिक र सिर्जनात्मक कामको दायरा देखायो।"
    - "UTAS विद्यार्थी Yu Wang ले LinkedIn मा उल्लेख गरेझैं, प्रदर्शनीमा SeaTalk, स्मार्ट रिसाइक्लिङ प्रणाली, मूल्य तुलना गर्ने वेबसाइट र सिर्जनात्मक गेमहरूसहित विभिन्न विद्यार्थी परियोजनाहरू थिए। Yu Wang ले Mobile Application Development विषयका लागि बनाएको एप प्रस्तुत गरेको व्यक्तिगत अनुभव पनि बाँडे, जसले प्रोग्रामिङ र व्यावहारिक एप विकासमा उनको प्रगति देखायो।"
    - "आगन्तुकहरूले प्रत्यक्ष प्रदर्शन हेर्ने, विद्यार्थी डेभलपरहरूसँग कुरा गर्ने र उनीहरूका परियोजनाका पछाडिका विचार र प्रविधिबारे जान्ने अवसर पाए। डिजिटल कार्यक्रम पुस्तिकामा परियोजनाका पोस्टर, प्रदर्शन भिडियो र खेल्न मिल्ने गेमहरू पनि थिए, जसले विद्यार्थीहरूको कामलाई फरक-फरक ढंगले हेर्न सम्भव बनायो।"
    - "एक्स्पोले हाल अध्ययनरत विद्यार्थी, विश्वविद्यालयका कर्मचारी, स्नातक र उद्योगका प्रतिनिधिबीच सम्बन्ध बढायो। पूर्व विद्यार्थीहरूको सहभागिताले School of ICT र यसका स्नातकहरूबीचको निरन्तर सम्बन्ध देखायो, र विद्यार्थीहरूलाई आफ्ना उपलब्धि प्रस्तुत गर्ने तथा पेसागत सञ्चार सीप विकास गर्ने अवसर दियो।"
    - "सफल कार्यक्रमपछि School of ICT ले अक्टोबर 2025 मा दोस्रो शोकेस गर्ने योजना घोषणा गर्‍यो, जसमा करिब दोब्बर परियोजनाहरू समावेश हुने अपेक्षा गरिएको थियो।"
    - "UTAS ICT विद्यार्थीहरूका लागि ICT Capstone Project Expo 2025 व्यावहारिक सीप देखाउने, प्राविधिक परियोजना प्रस्तुत गर्ने अनुभव लिने र स्थानीय ICT समुदायसँग जोडिने महत्त्वपूर्ण अवसर थियो। यसले टिमवर्क, सिर्जनशीलता र कक्षाको ज्ञानलाई व्यावहारिक सफ्टवेयर विकासका चुनौतीमा प्रयोग गर्नुको महत्त्व पनि देखायो।"
student_voice:
  en: "It was inspiring to see so many amazing projects at the expo, including SeaTalk, smart recycling systems, price comparison sites, and creative games."
  zh: "在展览会上看到这么多出色的项目令人鼓舞，包括SeaTalk、智能回收系统、价格比较网站和创意游戏。"
  ne: "प्रदर्शनीमा SeaTalk, स्मार्ट रिसाइकलिङ प्रणाली, मूल्य तुलना साइटहरू र सिर्जनशील खेलहरू लगायत यति धेरै शानदार प्रोजेक्टहरू देख्न प्रेरणादायी थियो।"
