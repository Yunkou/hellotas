    summary:
      en: "Lindsay Wells announces the return of the School of ICT's Demo Day after more than a decade. Staff, students, alumni and industry are invited to see live demos of mobile apps, websites and games from the KIT300 capstone teams on Wednesday 28 May, 10am to noon, in the Studio Theatre at Sandy Bay. Entry is free, with Eventbrite registration for catering."
