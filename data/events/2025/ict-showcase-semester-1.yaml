      ne: "Lindsay Wells ले दस वर्षभन्दा बढी पछि School of ICT को Demo Day फर्किएको घोषणा गर्छन्। कर्मचारी, विद्यार्थी, पूर्वविद्यार्थी र उद्योगका व्यक्तिहरूलाई बुधबार 28 मे बिहान 10 बजेदेखि मध्याह्नसम्म Sandy Bay को Studio Theatre मा KIT300 क्याप्स्टोन टोलीहरूका मोबाइल एप, वेबसाइट र खेलहरूको प्रत्यक्ष प्रदर्शन हेर्न निम्तो दिइएको छ। प्रवेश निःशुल्क छ, खानाको व्यवस्थाका लागि Eventbrite मा दर्ता गर्नुपर्छ।"
    url: "https://www.linkedin.com/posts/lindsay-wells-24658b76_ive-been-working-hard-to-bring-back-the-share-7327841456260292623-FuAS/"
