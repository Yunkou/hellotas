      ne: "प्रोग्रामिङबारे सुरुमा धेरै थोरै मात्र जानेका Yu Wang ले ICT Project Expo मा Mobile Application Development कोर्समा बनाएको एप प्रस्तुत गरे। पोस्टले Lindsay Wells को मार्गदर्शनलाई श्रेय दिन्छ र SeaTalk, स्मार्ट रिसाइक्लिङ प्रणाली, मूल्य तुलना गर्ने साइट र खेलहरू जस्ता अन्य प्रोजेक्टहरू पनि उल्लेख गर्छ।"
