      ne: "ठूलो सफलता! उपस्थित हुनुहुने सबैलाई र विद्यालयको नाम उज्यालो पार्ने विद्यार्थीहरूलाई धन्यवाद। हामीलाई समर्थन गर्न आउनुभएका यति धेरै परिचित पूर्वविद्यार्थी अनुहारहरू देख्दा एकदम राम्रो लाग्यो।"
