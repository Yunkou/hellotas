    ne: "नोभेम्बर ९ मा School of ICT ले होबार्ट र लन्सेस्टनमा पहिलो ICT Awards Night आयोजना गर्‍यो, जसमा परियोजना, अनुसन्धान, उद्योगसँगको काम र सामुदायिक भावनाका लागि ICT विद्यार्थीहरूलाई सम्मान गरियो।"
