baseURL = "https://weiluoyan.github.io/hellotas/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
# robots.txt (layouts/robots.txt) points search engines at the sitemap
enableRobotsTXT = true
# The site has no tags or categories, so don't publish empty /tags/ and /categories/ pages
disableKinds = ["taxonomy", "term"]

# Rendering a page includes making the right-sized copies of its photos (layouts/partials/img.html). The first
# build after a clean checkout makes all of them, which takes longer than Hugo's default 60 seconds a page.
timeout = "10m"

# The photos live in static/images/ and are published as they are. Mounting the same folder as assets/images
# lets templates also resize them (layouts/partials/img.html). Listing a folder here replaces Hugo's default
# for it, so static and assets are listed too.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[params]
  description = "A platform for all UTAS students, showcasing real events, experiences and highlights in Tasmania."
  # The community API (server/): accounts, event buddies, the Noticeboard, saved checklists and the weekly digest.
  # Empty: those features are hidden and the site works as a plain static site. The deploy workflow sets it from
  # the repository variable COMMUNITY_API_URL (or set HUGO_PARAMS_COMMUNITYAPI=http://127.0.0.1:8000 locally).
  communityAPI = ""
  # Where the code lives: used for the "Suggest an event" issue form link
  repoURL = "https://github.com/dongyi-guo/hellotas"
  author = "Luoyan Wei"
  defaultTheme = "light"

[params.homeInfoParams]
  Title = "ICT Futures in Tasmania"
  Content = "From Step 1 to the person you want to become."

[languages.en]
  locale = "en-AU"
  label = "English"
  title = "ICT Futures in Tasmania"
  weight = 1

[languages.zh]
  locale = "zh-cn"
  label = "简体中文"
  title = "塔斯马尼亚 ICT Futures"
  weight = 2

[languages.ne]
  locale = "ne-np"
  label = "नेपाली"
  title = "ICT Futures in Tasmania"
  weight = 3

# The journey steps live under /journey/ (Kickstart, Community, Volunteering), but the section has no page of its own:
# /journey/ redirects to Kickstart (see content/journey/step-1.md).
[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    kind = "section"
    path = "{/journey}"
