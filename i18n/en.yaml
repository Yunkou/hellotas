homeHabitSportsCta: "See free sports activities"
homeHabitGrowthTitle: "Become who you want to be, early"
homeHabitGrowthText: "Break big goals into small weekly habits. Join a project, volunteer, meet people — consistency beats cramming before graduation."
homeHabitGrowthCta: "See free growth opportunities"

