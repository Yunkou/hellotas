# Journey — 第一步（安顿生活）
journeyBackToJourney: "← 成长之路"
journeyStep1Eyebrow: "成长之路 · 第一步"
journeyStep1Title: "在这里开始新生活"
journeyStep1Lead: "先解决最基本的生存问题。稳定的基础，是一切可能的开始。"

journeyStep1Priority1Title: "生存收入"
journeyStep1Priority1Tag: "兼职工作"
journeyStep1Priority1Text: "学习期间需要收入来维持生活，请尽早开始寻找兼职。"
journeyStep1Priority1Sub: "在ATO官网免费申请税号（TFN），准备一页纸的简单简历，并关注UTAS职业中心（Careers portal）和招聘信息。求职前先在VEVO确认签证的工作时长限制，<strong>避免接受低于法定最低工资的现金工</strong>——这可能危及你的签证。"
journeyStep1Priority1ImageAlt: "学生在霍巴特咖啡馆做兼职"

journeyStep1Priority2Title: "住宿"
journeyStep1Priority2Tag: "安家"
journeyStep1Priority2Text: "尽早确定住处。UTAS宿舍常常很快满员。"
journeyStep1Priority2Sub: "优先申请UTAS宿舍，再用 <strong>Flatmates</strong> 或 <strong>Facebook Marketplace</strong> 寻找合租。付款前务必实地或视频看房——针对海外预订学生的租房骗局一直存在，房源再完美，没看房也不要付定金。"
journeyStep1Priority2ImageAlt: "霍巴特带花园和山景的合租房屋"

journeyStep1BasicsTitle: "日常生活基础"

