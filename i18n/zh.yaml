journeyStep2PeopleLibraries2: "Kingston 图书馆——零基础友好小组，每逢周四"
journeyStep2PeopleLibraries3: "Rosny 图书馆——随到随聊小组，每逢周二"

journeyStep2TipsTitle: "过来人的小建议"
journeyStep2TipsLead: "一位从 UTAS 语言中心起步的中国留学生，靠这些习惯让英语变成了日常。"
journeyStep2Tip1Title: "你的英语比你以为的要好"
journeyStep2Tip1Text: "考试练出来的是读写和听力，口语落后很正常——几乎人人都这样。口语是靠开口次数堆出来的，不是靠再多刷语法。"
journeyStep2Tip2Title: "在微小的瞬间练习"
journeyStep2Tip2Text: "每天多跟咖啡师、公交司机、收银员多说一句话。一个月后你会发现，闲聊不再可怕。"
journeyStep2Tip3Title: "一个固定小组胜过随机聊天"
journeyStep2Tip3Text: "选一个每周固定的小组并坚持去。熟悉的面孔和重复的话题，远比每次见陌生人容易开口。"
journeyStep2Tip4Title: "保留你的圈子，扩展你的声音"
journeyStep2Tip4Text: "通过中文朋友圈子获取活动信息完全没问题——只需约好到了现场就说英语。别担心口音：霍巴特本地人很有耐心，也习惯各种口音。"

journeyStep2NextTitle: "准备好连接你的行业了吗？"
journeyStep2NextText: "等你开口更有自信了，就该去认识 ICT 行业里的人了。"
journeyStep2NextCta: "前往第三步 →"

