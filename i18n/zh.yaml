journeyStep2LingoTitle: "UTAS Lingo Lounge"
journeyStep2LingoTag: "免费 · 校内"
journeyStep2LingoText: "由国际学生领袖（International Peer Leaders）主持的英语会话活动——他们都是高年级学生，完全理解刚来的头几周是什么感受。欢迎所有口语水平，现场提供免费下午茶。"
journeyStep2LingoWhen: "每学期每周举行——具体日期和教室请在 Uni App 的 “What's On” 里确认"
journeyStep2LingoWhere: "Sandy Bay 校区 Community Lounge 和 Morris Miller 图书馆（学生领袖在 Inveresk 和 Newnham 校区也有活动）"
