# Homepage — journey
homeJourneyTitle: "你的成长之路，一步一步"
homeJourneyLead: "从抵达塔斯马尼亚到获得第一份ICT工作，共七个实用阶段。按顺序进行，需要时随时回顾任何一步。"

homeStep1Title: "在这里开始新生活"
homeStep1Text: "寻找住宿（合租、寄宿家庭或UTAS宿舍），办理手机和银行账户，熟悉霍巴特交通，采购生活用品。<strong>在VEVO上核对签证条件</strong>（工作时长、出勤、OSHC），并妥善保管入学文件。感到不知所措很正常——先安顿下来，再逐步推进。"
homeStep1Cta: "抵达清单"
homeStep1ImageAlt: "学生在霍巴特安顿住宿"

homeStep2Title: "建立你的表达"
homeStep2Text: "若仍需通过英语考试，请将此作为首要目标。参加UTAS附近固定的本地志愿服务，在安全、有结构的环境中练习英语。"
homeStep2Cta: "语言中心 + 志愿服务"
homeStep2ImageAlt: "语言课堂上的学生"

homeStep3Title: "融入社区"
homeStep3Text: "错过了开放日？了解UTAS社团、图书馆服务与学生真实项目。记得查看UTAS邮箱和MyLO——重要活动与截止日期都会发布在那里。"
homeStep3Cta: "探索社团与图书馆"
homeStep3ImageAlt: "学生在校园项目中协作"

homeStep4Title: "参加ICT活动"
homeStep4Text: "了解往届活动与即将举行的活动——GDG Hobart、TasICT Festival、企业参观、墨尔本网络安全大会等。"
homeStep4Cta: "ICT活动列表"
homeStep4ImageAlt: "ICT会议与社交活动"

homeStep5Title: "打开大门"
homeStep5Text: "向你想进入的行业迈出第一步。在LinkedIn上与导师、校友、活动演讲者和本地ICT从业者建立联系。"
homeStep5Cta: "LinkedIn入门指南"
homeStep5ImageAlt: "职业社交与LinkedIn"

homeStep6Title: "建立信任"
homeStep6Text: "在澳大利亚，求职前通常需要推荐信。通过UTAS Motorsport、Food Hub、Source Garden、红十字会等岗位积累可验证的经验。"
homeStep6Cta: "经验与推荐信指南"
homeStep6ImageAlt: "社区志愿服务"

homeStep7Title: "走向你的未来"
homeStep7Text: "投递简历、参加面试，在塔斯马尼亚开启职业生涯。然后分享你的故事，让下一位学生相信这一切可以实现。"
homeStep7Cta: "求职准备 + 学生故事"
homeStep7ImageAlt: "毕业生庆祝获得工作机会"

