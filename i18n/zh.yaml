journeyStep2RedCrossTag: "志愿"
journeyStep2RedCrossText: "定期探访一位长者，一起喝茶聊天或打打牌。这是练习英语、听本地故事的温柔方式——红十字会提供培训和支持，并承担你的无犯罪证明费用。"
journeyStep2RedCrossWhen: "长期进行，时间迁就你的安排——请先在线申请"
