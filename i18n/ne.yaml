journeyStep2RedCrossTag: "स्वयंसेवा"
journeyStep2RedCrossText: "चिया वा कार्ड खेल्दै जेष्ठ समुदाय सदस्यलाई मैत्रीपूर्ण कुराकानीका लागि भेट्नुहोस्। अंग्रेजी अभ्यास र स्थानीय कथा सुन्ने नरम, फलदायी तरिका — रेड क्रसले तालिम र सहयोग दिन्छ, र प्रहरी जाँचको खर्च बेहोर्छ।"
