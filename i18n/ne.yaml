journeyStep2TipsTitle: "त्यहाँ पुगिसकेका व्यक्तिका सुझाव"
journeyStep2TipsLead: "UTAS भाषा केन्द्रबाट सुरु गरेका एक चिनियाँ अन्तर्राष्ट्रिय विद्यार्थीलाई अंग्रेजी सामान्य महसुस गराउन मद्दत गरेका बानी।"
journeyStep2Tip1Title: "तपाईंको अंग्रेजी तपाईंले सोचेभन्दा राम्रो छ"
journeyStep2Tip1Text: "परीक्षाहरूले पढाइ र सुनाइ तालिम दिन्छन्, त्यसैले बोलाइ पछाडि पर्छ — लगभग सबैका लागि यो सामान्य हो। बोलाइ दोहोर्याइबाट सुध्रिन्छ, थप व्याकरण अध्ययनबाट होइन।"
journeyStep2Tip2Title: "सानो क्षणमा अभ्यास गर्नुहोस्"
journeyStep2Tip2Text: "हरेक दिन बरिस्ता, बस चालक वा क्यासियरलाई एक अतिरिक्त वाक्य भन्नुहोस्। एक महिनापछि सानो कुराकानी डरलाग्दो हुँदैन।"
journeyStep2Tip3Title: "एउटा नियमित समूहले अनियमित च्याटलाई जित्छ"
journeyStep2Tip3Text: "साप्ताहिक समूह छानेर फर्किरहनुहोस्। परिचित अनुहार र दोहोरिने विषयले हरेक पटक अपरिचित भेट्नुभन्दा बोल्न धेरै सजिलो बनाउँछ।"
journeyStep2Tip4Title: "आफ्नो घेरा राख्नुहोस्, आवाज फैलाउनुहोस्"
journeyStep2Tip4Text: "चिनियाँभाषी साथीमार्फत गतिविधि खोज्नु ठिकै छ — त्यहाँ पुगेपछि अंग्रेजी बोल्ने सहमति मात्र गर्नुहोस्। र आफ्नो उच्चारणबारे चिन्ता नगर्नुहोस्: होबार्टका स्थानीय धैर्यवान छन् र धेरै उच्चारणमा अभ्यस्त छन्।"

journeyStep2NextTitle: "आफ्नो उद्योगसँग जोडिन तयार?"
journeyStep2NextText: "बोल्न थप आत्मविश्वास महसुस भएपछि ICT का मानिस भेट्ने बेला हो।"
journeyStep2NextCta: "चरण ३ मा जानुहोस् →"

