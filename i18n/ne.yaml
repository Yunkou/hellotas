homeHabitSportsText: "हरेक हप्ता निःशुल्क Parkrun, स्क्वास क्लब, ट्रेल रन — तस्मानियामा विश्वस्तरीय बाहिरी र भित्री खेलकुद छन्, जसले स्वस्थ रहन र कक्षाबाहिर मानिसहरू भेट्न मद्दत गर्छन्।"
