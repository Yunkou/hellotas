thumbPlaceholder: "कार्यक्रमको तस्बिर"
journeyBackToJourney: "← यात्रा"
journeyStep1Eyebrow: "यात्रा · चरण 1"
journeyStep1Title: "यहाँ आफ्नो जीवन सुरु गर्नुहोस्"
journeyStep1Lead: "सबैभन्दा पहिले गुजाराका आधारभूत कुराहरू मिलाउनुहोस्। बलियो जग भए बाँकी सबै सम्भव हुन्छ।"
journeyStep1Priority1Title: "गुजाराका लागि आम्दानी"
journeyStep1Priority1Tag: "क्याजुअल काम"
journeyStep1FirstTitle: "तपाईंका पहिलो 2 हप्ता"
journeyStep1First1Title: "SIM लिनुहोस्"
journeyStep1First1Text: "लगभग हरेक कामका लागि अस्ट्रेलियाली नम्बर चाहिन्छ।"
journeyStep1First2Title: "ठेगाना मिलाउनुहोस्"
journeyStep1First2Text: "तपाईंको TFN पत्र यही ठेगानामा हुलाकबाट आउँछ।"
journeyStep1First3Title: "बैंक खाता खोल्नुहोस्"
journeyStep1First3Text: "राहदानी लिएर जानुहोस्। अनलाइनबाट पनि सुरु गर्न सकिन्छ।"
journeyStep1First4Title: "TFN का लागि आवेदन दिनुहोस्"
journeyStep1First4Text: "ATO मा अनलाइन, निःशुल्क। करिब 2–4 हप्तामा हुलाकबाट आइपुग्छ।"
journeyStep1First5Title: "बसमा निःशुल्क यात्रा गर्नुहोस्"
journeyStep1First5Text: "30 जुन 2027 सम्म Metro बसहरू निःशुल्क छन्। कार्ड चाहिँदैन।"
journeyStep1First6Title: "जागिर खोज्न सुरु गर्नुहोस्"
journeyStep1First6Text: "आवेदन दिन TFN आउने प्रतीक्षा नगर्नुहोस्।"
journeyStep1Priority1Text: "पहिलो दिनदेखि नै जागिर खोज्न थाल्नुहोस्।"
journeyStep1IncomeResumeTitle: "बायोडाटा मिलाउनुहोस्"
journeyStep1IncomeResumeText: "हरेक किसिमको कामका लागि छुट्टै बायोडाटा बनाउनुहोस्: ग्राहक सेवा, होस्पिटालिटी वा भान्सा। पछि आफ्नै क्षेत्रका जागिर खोज्नुहोस्।"
journeyStep1IncomeApplyTitle: "अनलाइन आवेदन, अनि आफैँ जानुहोस्"
journeyStep1IncomeApplyText: "अनलाइन आवेदन दिनुहोस्, अनि भोलिपल्ट त्यही बायोडाटा लिएर आफैँ पुग्नुहोस्। क्याफे, सुपरमार्केट र पेट्रोल पम्पमा पनि प्रयास गर्नुहोस्।"
journeyStep1IncomeDeliveryTitle: "पर्खिँदा डेलिभरी गर्नुहोस्"
journeyStep1IncomeDeliveryText: "TFN भएपछि निःशुल्क <a href='https://www.abr.gov.au/business-super-funds-charities/applying-abn' target='_blank' rel='noopener'>ABN</a> लिनुहोस् र DoorDash वा Uber Eats मा दर्ता हुनुहोस्। छिटो पैसा आउँछ, तर यसलाई जागिरको अनुभव मानिँदैन।"
journeyStep1IncomeLinksLabel: "जागिर यहाँ खोज्नुहोस्:"
journeyStep1IncomeWarn1: "<strong><a href='https://immi.homeaffairs.gov.au/visas/already-have-a-visa/check-visa-details-and-conditions/check-conditions-online' target='_blank' rel='noopener'>VEVO</a> मा आफ्नो कामको घण्टाको सीमा जाँच्नुहोस्</strong> — डेलिभरीका घण्टा पनि गनिन्छन्।"
journeyStep1IncomeWarn2: "<strong>नगदमा मात्र दिइने (cash-in-hand) काम नगर्नुहोस्</strong> — प्रायः कम तलब, कर नतिरिने र भिसाका लागि जोखिमपूर्ण हुन्छ। <a href='https://www.fairwork.gov.au/tools-and-resources/fact-sheets/rights-and-obligations/international-students' target='_blank' rel='noopener'>आफ्ना अधिकार जान्नुहोस् ↗</a>"
journeyStep1Priority1ImageAlt: "क्याफे शैलीको भान्सामा टेबल वरिपरि बसेका University of Tasmania का विद्यार्थीहरू"
journeyStep1Priority2Title: "बसोबास"
journeyStep1Priority2Tag: "बस्ने ठाउँ"
journeyStep1Priority2Text: "आफ्नो ठाउँ चाँडै पक्का गर्नुहोस् — क्याम्पस नजिकका राम्रा कोठा छिट्टै सकिन्छन्।"
journeyStep1Priority2ImageAlt: "विश्वविद्यालय र Derwent नदी नजिकका Sandy Bay का घरहरूको हवाई दृश्य"
journeyStep1HomeSearchTitle: "अनलाइन खोज्नुहोस्"
journeyStep1HomeSearchText: "Flatmates र Facebook Marketplace मा कोठा र सेयर हाउस हेर्नुहोस्। आइपुग्नुअघि नै खोज्न थाल्नुहोस्।"
journeyStep1HomeGroupsTitle: "स्थानीय समूहमा जोडिनुहोस्"
journeyStep1HomeGroupsText: "Facebook मा होबार्टका भाडा र सेयर हाउस समूहमा जोडिनुहोस्। धेरै कोठाहरू त्यहाँ मात्र राखिन्छन्।"
journeyStep1HomeAskTitle: "अरू विद्यार्थीलाई सोध्नुहोस्"
journeyStep1HomeAskText: "UTAS का विद्यार्थीलाई उनीहरू कहाँ बस्छन् भनेर सोध्नुहोस्। उनीहरूको सेयर हाउसमा खाली हुन लागेका कोठाबारे उनीहरूलाई प्रायः थाहा हुन्छ।"
journeyStep1HomeLinksLabel: "कोठा यहाँ खोज्नुहोस्:"
journeyStep1HomeWarn1: "<strong>पैसा तिर्नुअघि कोठा हेर्नुहोस्</strong> — आफैँ गएर वा भिडियो कलमार्फत। विदेशबाट बुकिङ गर्ने विद्यार्थीलाई भाडाका ठगहरूले निशाना बनाउँछन्।"
journeyStep1HomeWarn2: "<strong>बन्ड (bond) MyBond मार्फत तिर्नुहोस्</strong>, घरधनीलाई सिधै कहिल्यै नदिनुहोस्। <a href='https://www.cbos.tas.gov.au/topics/housing/renting/bonds/paying-bond' target='_blank' rel='noopener'>बन्ड कसरी काम गर्छ ↗</a>"
