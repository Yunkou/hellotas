# Events list page
eventsTitle: "ICT कार्यक्रम संग्रह र विद्यार्थीहरूको आवाज"
eventsSubtitle: "तस्मानियामा सफलताको तपाईंको मार्गचित्र। पछिल्ला ICT विद्यार्थीहरूले पहिलो दिनदेखि आफ्नो सपनाको कामसम्म कसरी यात्रा गरे, हेर्नुहोस्।"
eventsShareLabel: "अनुभव हस्तान्तरण गर्नुहोस्। यी केवल कार्यक्रम संग्रह मात्र होइनन्—तस्मानियाका ICT विद्यार्थीहरू कसरी सिक्छन्, जोडिन्छन् र एकसाथ अघि बढ्छन् भन्ने प्रमाण हुन्।"
eventsCopyLink: "लिंक कपी गर्नुहोस्"
eventsLinkCopied: "कपी भयो ✓"
eventsBottomTitle: "हरेक वर्ष, विद्यार्थीहरू पूर्ववर्तीहरूको आधारमा अघि बढ्छन्।"
eventsBottomText1: "यी केवल कार्यक्रम अभिलेख होइनन्। यी तस्मानियाका ICT विद्यार्थीहरू सिक्ने, जोडिने र वृद्धि हुने प्रमाण हुन्।"
eventsBottomText2: "नयाँ विद्यार्थीहरूले यो पृष्ठ हेरेर सोच्न सक्छन्: मजस्ता मानिसहरूले यो गरिसकेका छन्। म पनि गर्न सक्छु।"

