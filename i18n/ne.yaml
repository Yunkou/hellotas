homeStep6Title: "विश्वास बनाउनुहोस्"
homeStep6Text: "अस्ट्रेलियामा जागिर पाउनुअघि प्रायः सिफारिस (references) चाहिन्छ। UTAS Motorsport, Food Hub, Source Garden, Red Cross र यस्तै भूमिकाहरूमार्फत अनुभव बटुल्नुहोस्।"
homeStep6Cta: "अनुभव र सिफारिस गाइड"
homeStep6ImageAlt: "स्वयंसेवाको पालोपछि चम्किलो भेस्ट लगाएका विद्यार्थी स्वयंसेवकहरू"
homeStep7Title: "आफ्नो भविष्यतर्फ बढ्नुहोस्"
homeStep7Text: "आवेदन दिनुहोस्, अन्तर्वार्ता दिनुहोस् र तस्मानियामा आफ्नो करियर सुरु गर्नुहोस्। त्यसपछि आफ्नो कथा सुनाउनुहोस्, ताकि अर्को विद्यार्थीले पनि सम्भव छ भनेर विश्वास गरोस्।"
homeStep7Cta: "जागिरका लागि तयार + कथाहरू"
