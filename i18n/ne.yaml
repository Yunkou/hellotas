journeyStep2TipsTitle: "यो बाटो हिँडिसकेकाको सुझाव"
journeyStep2TipsLead: "UTAS Language Centre बाट सुरु गरेकी एक चिनियाँ अन्तर्राष्ट्रिय विद्यार्थीलाई अंग्रेजी सहज बनाउन मद्दत गरेका बानीहरू।"
journeyStep2Tip1Title: "तपाईंको अंग्रेजी तपाईंले सोचेभन्दा राम्रो छ"
journeyStep2Tip1Text: "परीक्षाले पढाइ र सुनाइ सिकाउँछ, त्यसैले बोलाइ पछाडि पर्छ — यो लगभग सबैका लागि सामान्य हो। बोलाइ थप व्याकरण पढेर होइन, दोहोर्‍याएर सुध्रिन्छ।"
journeyStep2Tip2Title: "साना-साना पलमा अभ्यास गर्नुहोस्"
journeyStep2Tip2Text: "हरेक दिन बरिस्ता, बस चालक वा क्यासियरसँग एउटा वाक्य थप बोल्नुहोस्। एक महिनापछि सानातिना कुराकानी डरलाग्दो लाग्न छोड्छ।"
journeyStep2Tip3Title: "कहिलेकाहीँको कुराकानीभन्दा एउटा नियमित समूह राम्रो"
journeyStep2Tip3Text: "हरेक हप्ता हुने एउटा समूह छान्नुहोस् र फर्किरहनुहोस्। हरेक पटक अपरिचितलाई भेट्नुभन्दा चिनेका अनुहार र दोहोरिने विषयले बोल्न धेरै सजिलो बनाउँछन्।"
journeyStep2Tip4Title: "आफ्नो सर्कल राख्नुहोस्, आवाज फैलाउनुहोस्"
journeyStep2Tip4Text: "आफ्नै भाषा बोल्ने साथीहरूमार्फत गतिविधि खोज्नु ठीकै हो — त्यहाँ पुगेपछि अंग्रेजी बोल्ने सहमति गर्नुहोस्। उच्चारणको चिन्ता नगर्नुहोस्: होबार्टका स्थानीयहरू धैर्यवान् छन् र धेरै किसिमका उच्चारणमा अभ्यस्त छन्।"
journeyStep2NextTitle: "आफ्नो उद्योगसँग जोडिन तयार?"
journeyStep2NextText: "बोल्नमा अलि बढी आत्मविश्वास आएपछि ICT क्षेत्रका मानिसहरूलाई भेट्ने बेला हुन्छ।"
journeyStep2NextCta: "चरण 3 मा जानुहोस् →"
homeHeroTitle: "चरण 1 देखि तपाईं बन्न चाहेको"
homeHeroTitleHighlight: "व्यक्तिसम्म।"
homeHeroSubtitle: "तस्मानियामा सिक्नुहोस्, बढ्नुहोस् र जोडिनुहोस्। अन्तर्राष्ट्रिय ICT विद्यार्थीका लागि चरणबद्ध यात्रा। करियर आफैँ पछ्याउनेछ।"
homeHeroNote: "तस्मानियाका अन्तर्राष्ट्रिय ICT विद्यार्थीहरूद्वारा, उनीहरूकै लागि बनाइएको।"
homeHeroCtaStart: "चरण 1 सुरु गर्नुहोस्"
homeHeroCtaJourney: "पूरा यात्रा हेर्नुहोस्"
homeHeroImageAlt: "2026 TasICT Awards मा पुरस्कारसहित UTAS का विद्यार्थी, कर्मचारी र उद्योग साझेदारहरू"
homeTrustStrip: "<strong>पेसागत जागिर पाउन अनुभव + सिफारिस (references) चाहिन्छ।</strong> दुवै कुरा स्नातक भएपछि होइन, पहिलो सेमेस्टरदेखि नै बनाउन थाल्नुहोस्।"
homeJourneyTitle: "तपाईंको यात्रा, चरणबद्ध रूपमा"
homeJourneyLead: "आइपुगेदेखि तस्मानियामा पहिलो ICT भूमिकासम्मका सात व्यावहारिक चरणहरू। क्रमैसँग अघि बढ्नुहोस् — तर चाहिएको बेला जुनसुकै चरणमा फर्कनुहोस्।"
homeStep1Title: "यहाँ आफ्नो जीवन सुरु गर्नुहोस्"
homeStep1Text: "बसोबास खोज्नुहोस् (सेयर हाउस, होमस्टे वा UTAS आवास), फोन र बैंक खाता मिलाउनुहोस्, होबार्टको यातायात बुझ्नुहोस् र किराना सामान किन्नुहोस्। VEVO मा <strong>आफ्नो भिसाका सर्तहरू जाँच्नुहोस्</strong> (कामको घण्टा, कक्षा उपस्थिति, OSHC) र भर्नाका कागजात हातमै राख्नुहोस्। सुरुमा अलमल लाग्नु सामान्य हो — पहिले मिलेर बस्नुहोस्, अनि गति लिनुहोस्।"
homeStep1Cta: "आइपुगेपछिको चेकलिस्ट"
homeStep1ImageAlt: "UTAS को The Forest भवनभित्र रुख-उन्यूहरूबीच हिँडिरहेका विद्यार्थीहरू"
homeStep2Title: "आफ्नो आवाज बनाउनुहोस्"
homeStep2Text: "अझै अंग्रेजी परीक्षा पास गर्न बाँकी छ भने त्यसैलाई मुख्य प्राथमिकता बनाउनुहोस्। सुरक्षित र व्यवस्थित वातावरणमा अंग्रेजी अभ्यास गर्न UTAS नजिकैको नियमित स्थानीय स्वयंसेवामा सामेल हुनुहोस्।"
homeStep2Cta: "भाषा केन्द्र + स्वयंसेवा"
homeStep2ImageAlt: "kunanyi / Mount Wellington को दृश्यस्थलबाट सूर्योदय हेरिरहेका विद्यार्थीहरू"
homeStep3Title: "समुदायमा जोडिनुहोस्"
homeStep3Text: "ओपन डे छुट्यो? UTAS का क्लब, पुस्तकालय सेवा र विद्यार्थीका वास्तविक परियोजनाहरू पत्ता लगाउनुहोस्। आफ्नो UTAS इमेल र MyLO हेरिरहनुहोस् — महत्त्वपूर्ण कार्यक्रम र समयसीमा त्यहीँ राखिन्छन्।"
homeStep3Cta: "क्लब र पुस्तकालय हेर्नुहोस्"
homeStep3ImageAlt: "क्लबका स्टलसहितको खुला क्याम्पस महोत्सवमा विद्यार्थीहरू"
homeStep4Title: "ICT कार्यक्रममा सहभागी हुनुहोस्"
homeStep4Text: "पहिले के भयो र अब के आउँदैछ हेर्नुहोस् — GDG Hobart, TasICT Festival, उद्योग भ्रमण, CyberSecurity Melbourne र अन्य।"
homeStep4Cta: "ICT कार्यक्रमहरूको सूची"
homeStep4ImageAlt: "विद्यार्थी क्लबका टेन्टहरूले भरिएको UTAS क्याम्पसको चोक"
homeStep5Title: "ढोकाहरू खोल्नुहोस्"
homeStep5Text: "आफूले काम गर्न चाहेको उद्योगतर्फको पहिलो ढोका खोल्नुहोस्। LinkedIn मा ट्युटर, पूर्वविद्यार्थी, कार्यक्रमका वक्ता र स्थानीय ICT क्षेत्रका मानिसहरूसँग जोडिनुहोस्।"
