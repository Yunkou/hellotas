journeyStep3GccTitle: "Glenorchy Community Care"
journeyStep3GccText: "सामुदायिक कार्यक्रम, खाद्य वितरणमा मद्दत गर्नुहोस्, वा स्थानीय गैर-नाफामूलकलाई आफ्नो IT सीप दिनुहोस्। Churches of Glenorchy द्वारा सञ्चालित, यसले कम आम्दानी भएका घरपरिवारका लागि सस्तो किराना दिन्छ (लगभग $३० मा एक ट्रली खाना), र स्वयंसेवकले प्रमाणपत्र पाउन सक्छन्।"
