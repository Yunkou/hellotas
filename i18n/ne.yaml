journeyStep2Eyebrow: "यात्रा · चरण 2"
journeyStep2Title: "आफ्नो आवाज बनाउनुहोस्"
journeyStep2Lead: "आत्मविश्वास नियमित र दबाबरहित अभ्यासबाट आउँछ। सुन्न खुसी हुने मानिसहरूसँग सुरु गर्नुहोस्।"
journeyStep2WhyTitle: "सुरु गर्न सिद्ध अंग्रेजी चाहिँदैन। अभ्यास गर्ने सुरक्षित ठाउँ चाहिन्छ।"
journeyStep2WhyText: "तलका गतिविधिहरू निःशुल्क वा निकै सस्ता छन्, स्वागतयोग्य छन्, र तपाईं अहिले जहाँ हुनुहुन्छ त्यहीँका मानिसहरूका लागि बनाइएका छन्। आफ्नो हप्तामा मिल्ने एउटा छान्नुहोस् — सिद्ध बोल्नुभन्दा नियमित उपस्थित हुनु बढी महत्त्वपूर्ण हो।"
journeyStep2WhenLabel: "कहिले:"
journeyStep2WhereLabel: "कहाँ:"
journeyStep2AddressLabel: "ठेगाना"
journeyStep2PhoneLabel: "फोन"
