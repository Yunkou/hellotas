journeyStep2Section3Title: "आफ्ना मान्छे भेट्टाउनुहोस्"
journeyStep2LingoTitle: "UTAS Language Lounge"
journeyStep2LingoText: "International Peer Leaders — पहिलो हप्ताहरू कस्ता हुन्छन् भन्ने सम्झने सिनियर विद्यार्थीहरू — ले चलाउने, जहिले पनि आउन मिल्ने अंग्रेजी कुराकानी सत्र। बोल्ने जुनसुकै स्तरका लागि स्वागत छ।"
journeyStep2LingoWhen: "सेमेस्टरभरि हरेक हप्ता — हालको दिन र कोठाका लागि Uni App को “What's On” हेर्नुहोस्"
journeyStep2LingoWhere: "Morris Miller Library, Sandy Bay क्याम्पस — हालको दिन र कोठाका लागि Uni App को “What's On” हेर्नुहोस्"
journeyStep2LingoImageAlt: "क्याम्पसमा दिउँसोको चिया खाँदै अंग्रेजी कुराकानी अभ्यास गरिरहेका विद्यार्थीहरू"
journeyStep2MathersTitle: "Mathers House Café & Community"
journeyStep2MathersText: "State Library छेउमा रहेको City of Hobart को न्यानो सामुदायिक ठाउँ। सस्तो क्याफे खाजाका लागि आउनुहोस्, बोर्ड गेमदेखि युकुलेलेसम्मका गतिविधिमा बस्नुहोस्, वा Meet & Greet स्वयंसेवक बनेर आगन्तुकलाई बाटो देखाउन मद्दत गर्नुहोस्।"
journeyStep2MathersWhen: "क्याफे खाजा दिउँसो 12:00 – 1:30, सोमबारदेखि शुक्रबार"
journeyStep2MathersAddress: "108 Bathurst Street, Hobart TAS 7000"
journeyStep2MathersPhone: "03 6234 1441"
journeyStep2MathersLink: "hobartcity.com.au/Mathers-House"
