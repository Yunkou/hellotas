# Journey — Step 2 (build your voice)
journeyStep2Eyebrow: "यात्रा · चरण २"
journeyStep2Title: "आफ्नो आवाज बनाउनुहोस्"
journeyStep2Lead: "आत्मविश्वास नियमित, कम दबाबको अभ्यासबाट आउँछ। सुन्न खुसी हुने मानिससँग सुरु गर्नुहोस्।"

journeyStep2WhyTitle: "सुरु गर्न उत्तम अंग्रेजी चाहिँदैन। अभ्यास गर्न सुरक्षित ठाउँ चाहिन्छ।"
journeyStep2WhyText: "तलका गतिविधि निःशुल्क वा निकै सस्ता, स्वागतयोग्य र अहिलेको तपाईंका लागि बनाइएका हुन्। हप्तामा मिल्ने एउटा छान्नुहोस् — पूर्ण रूपमा बोल्नुभन्दा नियमित रूपमा आउनु महत्त्वपूर्ण छ।"

