homeHeroSubtitle: "तपाईंले एक्लै बुझ्न पर्दैन। यी चरणहरू पालना गर्नुहोस्—बसोबास मिलाउनुहोस्, आफ्नो समुदाय खोज्नुहोस्, र मन पर्ने जीवन बनाउनुहोस्।"
homeHeroNote: "तस्मानियाका अन्तर्राष्ट्रिय ICT विद्यार्थीहरूद्वारा निर्मित, तिनैका लागि।"
