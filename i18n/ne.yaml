journeyStep2PeopleMrc1: "आप्रवासीका लागि सामुदायिक कार्यक्रम र सामाजिक समूह — योग्यताका नियम फरक हुन्छन्, त्यसैले सोधिहाल्नुहोस्"
journeyStep2PeopleMrc2: "होबार्ट कार्यालय: Glenorchy · लन्सेस्टन कार्यालय: 53 Elizabeth Street"
journeyStep2PeopleMrc3: "(03) 6221 0999 — <a href=\"https://mrctas.org.au/\" target=\"_blank\" rel=\"noopener\">mrctas.org.au</a>"
journeyStep2PeopleLibrariesTitle: "लन्सेस्टन र क्षेत्रीय पुस्तकालयहरू"
journeyStep2PeopleLibrariesImageAlt: "भित्र पाठकहरू भएको क्षेत्रीय सार्वजनिक पुस्तकालय भवन"
journeyStep2PeopleLibraries1: "Launceston Library — अंग्रेजी कुराकानी कक्षा, फोन (03) 6777 2446"
