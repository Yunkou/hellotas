journeyStep1MissedTitle: "अभिमुखीकरण (orientation) छुट्यो?"
journeyStep1MissedText: "केही छैन — धेरै विद्यार्थी ढिलो आइपुग्छन्। पहिले माथिको चेकलिस्टमा ध्यान दिनुहोस्। क्लब, पुस्तकालय भ्रमण र क्याम्पस जीवन चरण 3 मा भेट्न सक्नुहुन्छ।"
