journeyStep2PeopleTusaTitle: "TUSA Clubs & Societies"
journeyStep2PeopleTusaImageAlt: "क्याम्पस मेलामा क्लबका लागि नाम लेखाउँदै विद्यार्थीहरू"
journeyStep2PeopleTusa1: "100+ क्लब तथा संस्था — खेलकुद, गेम, संस्कृति, फोटोग्राफी"
journeyStep2PeopleTusa2: "नियमित कार्यक्रम गर्ने 20+ अन्तर्राष्ट्रिय विद्यार्थी संस्था"
journeyStep2PeopleTusa3: "UTAS विद्यार्थीका लागि निःशुल्क सदस्यता — <a href=\"https://tusa.org.au/find-a-club-society/\" target=\"_blank\" rel=\"noopener\">tusa.org.au</a>"
