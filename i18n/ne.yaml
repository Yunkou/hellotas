journeyStep3CyberText: "UTAS मा साइबरसुरक्षा समुदाय बनाउँदै गरेको नयाँ विद्यार्थी-नेतृत्व क्लब। सचेतना सत्र, विद्यार्थी अवसर, र साथीसँग सिक्ने तथा सहकार्य गर्ने तरिकाका लागि क्लब अपडेट पछ्याउनुहोस् — अघिल्लो सुरक्षा अनुभव चाहिँदैन।"
