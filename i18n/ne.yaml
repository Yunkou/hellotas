homeHabitGrowthText: "ठूला लक्ष्यलाई साना साप्ताहिक बानीमा टुक्र्याउनुहोस्। परियोजनामा सामेल हुनुहोस्, स्वयंसेवा गर्नुहोस्, मानिसहरू भेट्नुहोस् — स्नातक हुनुअघि हतारमा गर्नुभन्दा निरन्तरता धेरै प्रभावकारी हुन्छ।"
