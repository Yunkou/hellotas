journeyStep2MathersText: "राज्य पुस्तकालय छेउको न्यानो City of Hobart सामुदायिक स्थान। सस्तो क्याफे खाजाका लागि आउनुहोस्, बोर्ड गेमदेखि युकेलेलसम्मका गतिविधिमा बस्नुहोस्, वा Meet & Greet स्वयंसेवक बनेर आगन्तुकलाई बाटो देखाउन मद्दत गर्नुहोस्।"
