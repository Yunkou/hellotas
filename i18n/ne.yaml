journeyStep3MotorsportText: "विद्यार्थी-संचालित Formula SAE टोली जसले हरेक वर्ष आफ्नै खुला-पाङ्ग्रे रेस कार डिजाइन, कोष सङ्कलन, निर्माण र दौड गर्छ। उद्योग प्रायोजकसहित वास्तविक परियोजना अनुभव — र सदस्यहरू इन्जिनियरिङ, ICT, व्यवसाय र मिडियाबाट आउँछन्।"
