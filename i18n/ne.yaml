journeyStep3GccText: "सामुदायिक कार्यक्रम, खाद्य वितरणमा मद्दत गर्नुहोस्, वा स्थानीय गैरनाफामूलक संस्थालाई आफ्नो IT सीप दिनुहोस्। Churches of Glenorchy ले चलाउने यो संस्थाले न्यून आय भएका परिवारलाई सस्तो किराना ($30 मा एक ट्रली खाना) उपलब्ध गराउँछ, र स्वयंसेवकले प्रमाणपत्र पनि पाउन सक्छन्।"
