# Fork-only custom-domain build settings for Yunkou/hellotas.
# Used by scripts/build-fork-domain.sh and scripts/deploy-fork-gh-pages.sh.
# Does not replace hugo.toml (upstream / GitHub Pages subpath default stays
# https://weiluoyan.github.io/hellotas/).
#
# This fork binds ictfutureintas.com (future, singular).
# Do not use ictfuturesintas.com (futures, plural): that domain is the
# upstream official site and must not be written as this fork's CNAME or
# baseURL. Also do not use the typo ictfurturesintas.com.
FORK_DOMAIN=ictfutureintas.com
FORK_BASEURL=https://ictfutureintas.com/
